<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1a1a1a" />
<title>agentweb</title>
<script>
try{var __t=localStorage.getItem("aiagent.theme")||"dark";document.documentElement.setAttribute("data-theme",__t);}catch(e){}
</script>
<style>
  /* =====================================================================
     Pi Web 風テーマ
       色・形状は Pi Web の CSS 変数 (--bg / --bg-panel / --border /
       --text / --accent / --user-bg / --tool-bg ...) と同じ値を使用。
     ===================================================================== */
  :root {
    color-scheme: dark;
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Noto Sans Mono", monospace;

    /* Pi Web と同じ変数名 */
    --bg: #1a1a1a;
    --bg-panel: #242424;
    --bg-hover: #2e2e2e;
    --bg-selected: #383838;
    --border: #3a3a3a;
    --text: #e8e8e8;
    --text-muted: #9ca3af;
    --text-dim: #6b7280;
    --accent: #60a5fa;
    --accent-hover: #93c5fd;
    --accent-dim: #1c3a5e;
    --user-bg: #1e293b;
    --tool-bg: #1f2937;
    --subtle: rgba(255,255,255,.04);
    --danger: #f87171;
    --radius: 8px;
    /* 下部バーの高さ（セッション欄と settings を揃える） */
    --bar-h: 30px;
    /* 入力欄と送信ボタンの高さ（同じ値で揃える） */
    --input-h: 52px;
    /* 旧名 (エイリアス) */
    --panel: var(--bg-panel);
    --panel-2: var(--bg-hover);
    --panel-3: var(--bg-selected);
    --muted: var(--text-muted);
    --dim: var(--text-dim);

    background: var(--bg);
    color: var(--text);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff;
    --bg-panel: #f5f5f5;
    --bg-hover: #eeeeee;
    --bg-selected: #e8e8e8;
    --border: #e0e0e0;
    --text: #1a1a1a;
    --text-muted: #6b7280;
    --text-dim: #9ca3af;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-dim: #dbeafe;
    --user-bg: #eff6ff;
    --tool-bg: #f9fafb;
    --subtle: rgba(0,0,0,.03);
    --danger: #dc2626;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  .layout { display: flex; flex: 1; min-height: 0; }

  /* ---------- chat ---------- */
  main { flex: 1; overflow-y: auto; }
  main::-webkit-scrollbar { width: 12px; }
  main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
  .chat {
    max-width: 820px;
    margin: 0 auto;
    padding: 26px 22px 44px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* message rows (Pi Web: user は flex-end / gap 6 / maxWidth 85%) */
  .msg { display: flex; gap: 6px; align-items: flex-end; }
  .msg.user { flex-direction: row-reverse; }
  .bubble {
    position: relative;
    max-width: 85%;
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }
  .msg.assistant .bubble {
    background: transparent;
    border: none;
    border-radius: 0;
    padding: 2px 16px 0 0;
    max-width: 100%;
    flex: 1;
    min-width: 0;
    color: var(--text);
  }
  .msg.user .bubble {
    background: var(--user-bg);
    border: 1px solid rgba(59,130,246,.2);
    color: var(--text);
    white-space: pre-wrap;
  }
  .msg.user .copy-btn:hover { background: var(--subtle); color: var(--text); }

  /* コピーボタン */
  .copy-btn {
    position: absolute;
    top: 2px; right: 2px;
    width: 18px; height: 18px;
    padding: 0;
    border: none;
    border-radius: 4px;
    background: transparent;
    color: var(--muted);
    line-height: 1;
    cursor: pointer;
    display: grid; place-items: center;
    opacity: 0;
    transition: opacity .12s ease;
  }
  .msg:hover .copy-btn, .copy-btn:focus { opacity: .6; }
  .copy-btn:hover { opacity: 1; background: var(--panel-2); color: var(--text); }
  .copy-btn.copied { opacity: 1; color: var(--accent); }
  .ts { font-size: 11px; color: var(--dim); margin-top: 4px; }
  .msg.user .ts { text-align: right; }
  .msg.assistant .ts { text-align: left; }

  /* ---------- markdown ---------- */
  .md { font-size: 14px; line-height: 1.6; }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md h1, .md h2, .md h3, .md h4 { color: var(--text); line-height: 1.3; margin: 20px 0 8px; font-weight: 650; letter-spacing: -0.01em; }
  .md h1 { font-size: 21px; } .md h2 { font-size: 18px; } .md h3 { font-size: 16px; }
  .md p { margin: 8px 0; }
  .md ul, .md ol { margin: 8px 0; padding-left: 22px; }
  .md li { margin: 3px 0; }
  .md a { color: var(--accent); }
  .md code {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    font-family: var(--font-mono);
    font-size: 12.5px;
  }
  .md pre {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    overflow-x: auto;
  }
  .md pre code { background: none; border: none; padding: 0; font-size: 12.5px; line-height: 1.55; }
  .md blockquote {
    margin: 10px 0; padding: 2px 14px;
    border-left: 3px solid var(--border);
    color: var(--muted);
  }
  .mermaid {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin: 10px 0;
    padding: 10px;
    overflow-x: auto;
    text-align: center;
  }
  .mermaid svg { max-width: 100%; height: auto; }
  .mermaid-loading { font-size: 12px; color: var(--muted); padding: 12px; }
  .mermaid-fallback { font-size: 12px; text-align: left; background: var(--panel-2); padding: 8px; border-radius: 6px; white-space: pre-wrap; }
  .mermaid-note { font-size: 11px; color: var(--danger); margin-top: 4px; }
  .md table { border-collapse: collapse; margin: 10px 0; font-size: 13px; }
  .md th, .md td { border: 1px solid var(--border); padding: 6px 10px; }
  .md th { background: var(--panel); }
  .md hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

  /* ---------- waiting / tool / thinking ---------- */
  .progress {
    margin: 0 0 8px;
    display: flex; flex-direction: column; gap: 2px;
    background: var(--tool-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 10px;
  }
  /* 待機表示 (Pi Web の chat.waitingModel と同じパルス文字) */
  .waiting { margin: 0 0 2px; font-size: 13px; color: var(--text-muted); }
  .waiting .wtext { animation: wpulse 1.5s infinite; }
  @keyframes wpulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  /* Thinking ヘッダの tok/s (Pi Web 風) */
  .think > summary .rate { color: var(--text-dim); font-family: var(--font-mono); font-size: 11px; margin-left: 6px; }
  .pstep { font-size: 11.5px; color: var(--accent); word-break: break-all; font-weight: 600; }
  .pdetail {
    font-size: 11.5px; color: var(--muted);
    font-family: var(--font-mono);
    white-space: pre-wrap; word-break: break-all;
    padding-left: 12px;
  }
  .think { margin: 0 0 10px; border-left: 2px solid var(--border); padding: 2px 10px; }
  .think > summary {
    cursor: pointer; font-size: 11.5px; color: var(--muted);
    list-style: none; user-select: none; outline: none;
  }
  .think > summary::-webkit-details-marker { display: none; }
  .think > summary:hover { color: var(--text); }
  .think-body {
    font-size: 12px; line-height: 1.55; color: var(--muted);
    white-space: pre-wrap; word-wrap: break-word;
    margin-top: 4px; max-height: 240px; overflow-y: auto;
  }
  @keyframes blink { 0%,80%,100% { opacity:.25 } 40% { opacity:1 } }

  .err { color: var(--danger); font-size: 13px; padding: 4px 2px; }

  /* ---------- composer ---------- */
  footer {
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
  }
  .composer {
    max-width: 860px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    flex-wrap: wrap;
  }
  .composer .side { display: flex; flex-direction: column; align-items: stretch; gap: 8px; flex: 1; min-width: 0; }
  /* settings はバー行の右端(送信ボタンの真下) */
  .settings-btn {
    margin-left: auto;     /* 右端へ寄せる */
    height: var(--bar-h);
    padding: 0 10px;
    font-size: 11px;
    line-height: 1;
    white-space: nowrap;
    text-align: center;
  }
  /* セッション欄は左寄せ(テキストエリアの左端に揃える) */
  .composer-bar {
    max-width: 860px;
    margin: 8px auto 0;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 11px;
    color: var(--muted);
  }
  .theme-link {
    cursor: pointer;
    font: inherit;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--muted);
    padding: 3px 9px;
  }
  .theme-link:hover { background: var(--panel-2); color: var(--text); }
  /* 思考中は settings ボタンを無効化する */
  .theme-link:disabled { opacity: .45; cursor: default; }
  .theme-link:disabled:hover { background: var(--bg); color: var(--muted); }

  /* ---------- モデル選択（セッション欄の左） ---------- */
  .model-select {
    flex: 0 1 auto;
    min-width: 0;
    max-width: 240px;
    height: var(--bar-h);
    font-size: 11px;
  }

  /* ---------- セッション欄（左寄せ） ---------- */
  .sess-panel {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 0 1 auto;
    min-width: 0;
    max-width: 420px;
  }
  /* ドロップダウン（サイドバーと同じ配色） */
  .sess-select {
    flex: 1 1 auto;
    min-width: 0;
    height: var(--bar-h);
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
    font-size: 11px;
    padding: 0 4px;
    cursor: pointer;
    outline: none;
  }
  .sess-select:hover { background: var(--panel-2); }
  .sess-select:focus { border-color: var(--accent); }
  /* 思考中はドロップダウンを無効化する */
  .sess-select:disabled { opacity: .45; cursor: default; background: var(--bg); }
  .sess-select:disabled:hover { background: var(--bg); }
  .sess-select option { background: var(--bg); color: var(--text); }
  /* ボタンはサイドバーと同じアイコンボタン（常時表示） */
  .sess-actions { display: flex; align-items: center; gap: 2px; flex: none; }
  .sess-actions .s-auto,
  .sess-actions .s-ren,
  .sess-actions .s-del,
  .sess-actions .s-new {
    flex: none;
    width: var(--bar-h); height: var(--bar-h);
    border: none;
    border-radius: 4px;
    background: transparent;
    color: var(--muted);
    font: inherit; font-size: 14px; line-height: 1;
    cursor: pointer;
    display: grid; place-items: center;
    opacity: 1;
  }
  .sess-actions .s-auto:hover { background: var(--panel-2); color: var(--accent); }
  .sess-actions .s-ren:hover { background: var(--panel-2); color: var(--accent); }
  .sess-actions .s-del:hover { background: var(--panel-2); color: var(--danger); }
  .sess-actions .s-new:hover { background: var(--panel-2); color: var(--accent); }
  .sess-actions .s-auto:disabled,
  .sess-actions .s-ren:disabled,
  .sess-actions .s-del:disabled,
  .sess-actions .s-new:disabled { opacity: .4; cursor: default; background: transparent; color: var(--muted); }
  .sess-actions .s-auto:disabled:hover,
  .sess-actions .s-ren:disabled:hover,
  .sess-actions .s-del:disabled:hover,
  .sess-actions .s-new:disabled:hover { background: transparent; color: var(--muted); }
  /* 名前変更はドロップダウンを入力欄に差し替えてインライン編集する */
  .sess-select.editing { display: none; }
  .sess-edit {
    flex: 1 1 auto;
    min-width: 0;
    height: var(--bar-h);
    border: 1px solid var(--accent);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
    font-size: 11px;
    padding: 0 6px;
    outline: none;
  }
  textarea {
    width: 100%;
    resize: none;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font: inherit;
    font-size: 14px;
    line-height: 1.6;
    padding: 11px 13px;
    min-height: var(--input-h);
    max-height: 200px;
    outline: none;
    transition: border-color .12s ease;
  }
  textarea::placeholder { color: var(--dim); }
  textarea:focus { border-color: var(--accent); }
  button.send {
    flex: none;
    height: var(--input-h); min-width: 62px;
    border: 1px solid var(--accent);
    border-radius: 10px;
    background: var(--accent);
    color: #0b1220;
    font: inherit;
    font-weight: 650;
    font-size: 14px;
    cursor: pointer;
    display: grid; place-items: center;
  }
  button.send:disabled { opacity: .45; cursor: not-allowed; }
  button.send:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  :root[data-theme="light"] button.send { color: #ffffff; }
  /* 生成中(停止ボタン)は Pi Web と同じ赤 */
  button.send.stop {
    background: #ef4444;
    border-color: #ef4444;
    color: #ffffff;
  }
  button.send.stop:hover:not(:disabled) { background: #dc2626; border-color: #dc2626; }
  button.ghost {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--muted);
    height: 36px; padding: 0 14px;
    border-radius: 6px;
    font: inherit; font-size: 13px;
    cursor: pointer;
  }
  button.ghost:hover { background: var(--panel-2); color: var(--text); }

  /* ---------- 設定モーダル (Pi Web のモーダルに合わせた見た目) ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0,0,0,.5);
    display: grid;
    place-items: center;
    padding: 16px;
  }
  .modal {
    width: min(760px, 96vw);
    max-height: 88vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 8px 32px rgba(0,0,0,.18);
  }
  .modal-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  .modal-title { font-size: 15px; font-weight: 700; color: var(--text); }
  .modal-body {
    padding: 16px 18px;
    overflow-y: auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 16px;
  }
  .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .field.full { grid-column: 1 / -1; }
  .field > label { font-size: 12px; color: var(--text-muted); }
  .field input[type="text"],
  .field input[type="password"],
  .field input[type="number"],
  .field textarea {
    width: 100%;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font: inherit;
    font-size: 13px;
    padding: 7px 9px;
    outline: none;
  }
  .field input:focus, .field textarea:focus { border-color: var(--accent); }
  .field textarea {
    min-height: 130px;
    resize: vertical;
    font-family: var(--font-mono);
    font-size: 12.5px;
    line-height: 1.5;
  }
  /* モデル一覧のエディタ */
  .models-editor { display: flex; flex-direction: column; gap: 8px; }
  .model-row {
    display: grid;
    grid-template-columns: 1fr 28px;   /* モデル名 + 削除ボタンだけ */
    gap: 6px;
    align-items: center;
  }
  .model-row input {
    width: 100%;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font: inherit;
    font-size: 12px;
    padding: 6px 8px;
    outline: none;
    min-width: 0;
  }
  .model-row input:focus { border-color: var(--accent); }
  .model-row .m-del {
    width: 24px; height: 24px;
    border: none; border-radius: 4px;
    background: transparent;
    color: var(--muted);
    font: inherit; font-size: 14px; line-height: 1;
    cursor: pointer;
    display: grid; place-items: center;
  }
  .model-row .m-del:hover { background: var(--panel-2); color: var(--danger); }
  .model-row .m-del:disabled { opacity: .35; cursor: default; background: transparent; color: var(--muted); }
  .model-add {
    align-self: flex-start;
    cursor: pointer;
    font: inherit; font-size: 12px;
    border: 1px dashed var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    padding: 5px 10px;
  }
  .model-add:hover { background: var(--panel-2); color: var(--text); border-color: var(--accent); }
  .model-head {
    display: grid;
    grid-template-columns: 1fr 28px;
    gap: 6px;
    font-size: 11px;
    color: var(--text-dim);
  }
  @media (max-width: 720px) {
    .model-head { display: none; }
  }
  .field.bool { flex-direction: row; align-items: center; gap: 8px; }
  .field.bool input { width: 15px; height: 15px; accent-color: var(--accent); }
  .modal-foot {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 18px;
    border-top: 1px solid var(--border);
    flex: none;
  }
  .modal-hint {
    flex: 1; min-width: 0;
    font-size: 11px; color: var(--text-dim);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .btn {
    height: 36px;
    padding: 0 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-panel);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .btn:hover { background: var(--bg-hover); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn:disabled:hover { background: var(--bg-panel); }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #0b1220;
    font-weight: 600;
  }
  .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  :root[data-theme="light"] .btn.primary { color: #ffffff; }
  .icon-btn {
    width: 28px; height: 28px;
    border: none; border-radius: 6px;
    background: transparent;
    color: var(--text-muted);
    font-size: 16px; line-height: 1;
    cursor: pointer;
    display: grid; place-items: center;
  }
  .icon-btn:hover { background: var(--bg-hover); color: var(--text); }

  @media (max-width: 980px) {
    .sess-panel { max-width: none; flex: 1 1 auto; }
  }
  @media (max-width: 700px) {
    .modal-body { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .bubble { max-width: 92%; }
    .chat { padding: 18px 14px 36px; }
  }
</style>
</head>
<body>
  <div class="layout">
    <main id="main">
      <div class="chat" id="chat"></div>
    </main>
  </div>

  <footer>
    <div class="composer">
      <div class="side">
        <textarea id="input" rows="1" placeholder="AI エージェントに質問する…  (Enter で送信 / Shift+Enter で改行)"></textarea>
      </div>
      <button type="button" class="send" id="sendBtn" disabled title="送信">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M3.4 20.4 22 12 3.4 3.6 3.4 10 15 12 3.4 14Z"/>
        </svg>
      </button>
    </div>
    <div class="composer-bar">
      <select class="sess-select model-select" id="modelSelect" title="使用するモデルを選択" aria-label="モデル一覧"></select>
      <div class="sess-panel">
        <select class="sess-select" id="settingsSessionList" title="セッションを選択" aria-label="セッション一覧"></select>
        <div class="sess-actions">
          <button type="button" class="s-auto" id="settingsAutotitle" title="会話内容から名前を自動設定">⟳</button>
          <button type="button" class="s-ren" id="settingsRename" title="名前を変更">✎</button>
          <button type="button" class="s-del" id="settingsDelete" title="このセッションを削除">×</button>
          <button type="button" class="s-new" id="settingsNew" title="新しいセッションを作成">＋</button>
        </div>
      </div>
      <button type="button" class="theme-link settings-btn" id="settingsBtn" title="設定">⚙ settings</button>
    </div>
  </footer>

  <!-- 設定モーダル -->
  <div class="modal-overlay" id="settingsModal" style="display:none">
    <div class="modal" role="dialog" aria-modal="true" aria-label="設定">
      <div class="modal-head">
        <div class="modal-title">Settings</div>
        <button type="button" class="icon-btn" id="settingsClose" title="閉じる" style="margin-left:auto">×</button>
      </div>
      <div class="modal-body" id="settingsBody"></div>
      <div class="modal-foot">
        <span class="modal-hint" id="settingsHint"></span>

        <button type="button" class="btn primary" id="settingsSave">Save</button>
      </div>
    </div>
  </div>

<script>
"use strict";

/* ---------- tiny markdown renderer (XSS-safe: escapes then formats) ---------- */
function escapeHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
          .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function renderMarkdown(src) {
  // mermaid ブロックはエスケープ前に退避(プレースホルダ化)
  var mermaidSrc = [];
  src = String(src || "").replace(/```mermaid\s*\n([\s\S]*?)```/gi, function(_, code){
    mermaidSrc.push(code.replace(/\n$/, ""));
    return "\u0000M" + (mermaidSrc.length - 1) + "\u0000";
  });
  src = escapeHtml(src || "");
  // code blocks
  src = src.replace(/```([A-Za-z0-9_+-]*)\n([\s\S]*?)```/g, function(_, lang, code){
    return "<pre><code>" + code.replace(/\n$/, "") + "</code></pre>";
  });
  // inline code
  src = src.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  // headings
  src = src.replace(/^###### (.*)$/gm, "<h6>$1</h6>");
  src = src.replace(/^##### (.*)$/gm, "<h5>$1</h5>");
  src = src.replace(/^#### (.*)$/gm, "<h4>$1</h4>");
  src = src.replace(/^### (.*)$/gm, "<h3>$1</h3>");
  src = src.replace(/^## (.*)$/gm, "<h2>$1</h2>");
  src = src.replace(/^# (.*)$/gm, "<h1>$1</h1>");
  // links
  src = src.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // bold / italic
  src = src.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  src = src.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  // blockquote
  src = src.replace(/^&gt; (.*)$/gm, function(_, t){ return "<blockquote>" + t + "</blockquote>"; });
  // hr
  src = src.replace(/^---+$/gm, "<hr/>");
  // lists (unordered/ordered) - li を必ず ul/ol で囲む
  src = src.replace(/^[ \t]*[-*+][ \t]+(.*)$/gm, "<li class=\"u\">$1</li>");
  src = src.replace(/^[ \t]*\d+\.[ \t]+(.*)$/gm, "<li class=\"o\">$1</li>");
  src = src.replace(/((?:<li class=\"u\">.*?<\/li>[ \t]*\n?)+)/g, "<ul>$1</ul>");
  src = src.replace(/((?:<li class=\"o\">.*?<\/li>[ \t]*\n?)+)/g, "<ol>$1</ol>");
  src = src.replace(/<li class=\"u\">/g, "<li>");
  src = src.replace(/<li class=\"o\">/g, "<li>");
  // tables  (Markdown 表: | a | b |  + separator)
  src = src.replace(/((?:^\|[^\n]*\|[ \t]*$\n?)+)/gm, function(block){
    var lines = block.trim().split("\n").map(function(l){ return l.trim(); })
      .filter(function(l){ return /^\|.*\|$/.test(l); });
    if (lines.length < 2) return block;
    var cells = function(l){ return l.replace(/^\||\|$/g,"").split("|").map(function(c){ return c.trim(); }); };
    var isSep = function(l){ return /[\s|:-]+/.test(l) && l.indexOf("-") >= 0 && !/[^\s|:-]/.test(l); };
    var header = cells(lines[0]);
    var start = (lines.length > 1 && isSep(lines[1])) ? 1 : 0;
    var thead = "<thead><tr>" + header.map(function(c){ return "<th>" + c + "</th>"; }).join("") + "</tr></thead>";
    var tbody = "<tbody>";
    for (var t = start + 1; t < lines.length; t++){
      var cs = cells(lines[t]);
      if (cs.length > 0) tbody += "<tr>" + cs.map(function(c){ return "<td>" + c + "</td>"; }).join("") + "</tr>";
    }
    tbody += "</tbody>";
    return "<table>" + thead + tbody + "</table>";
  });
  // mermaid プレースホルダを実体(div)へ戻す。行頭が '<' なので段落化で囲まれない
  src = src.replace(/\u0000M(\d+)\u0000/g, function(_, i){
    return '<div class="mermaid" data-b64="' + b64e(mermaidSrc[parseInt(i,10)]) + '"></div>';
  });
  // paragraphs (group consecutive non-list/tag lines)
  src = src.replace(/^([^<][^\n]*)$/gm, function(m){ return "<p>"+m+"</p>"; });
  return src.replace(/\n{2,}/g, "\n").trim();
}

/* ---------- Mermaid レンダリング ---------- */
function b64e(s){ try{ return btoa(unescape(encodeURIComponent(s))); }catch(e){ return btoa(s); } }
function decodeB64(s){ try{ return decodeURIComponent(escape(atob(s))); }catch(e){ return atob(s); } }

var __mermaidState = { loaded:false, loading:false };
function showMermaidError(el){
  var src = decodeB64(el.getAttribute("data-b64")||"");
  el.innerHTML = '<pre class="mermaid-fallback">' + escapeHtml(src) + '</pre>' +
                 '<div class="mermaid-note">&#9888; Mermaid 表示に失敗しました(CDNに接続できませんでした)。</div>';
  el.classList.add("done");
}
function loadMermaid(cb){
  if (window.mermaid) { cb(); return; }
  if (__mermaidState.loading) { setTimeout(function(){ loadMermaid(cb); }, 250); return; }
  __mermaidState.loading = true;
  var s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js";
  s.onload = function(){ __mermaidState.loaded = true; __mermaidState.loading = false; cb(); };
  s.onerror = function(){
    __mermaidState.loading = false;
    var els = document.querySelectorAll(".mermaid[data-b64]:not(.done)");
    Array.prototype.forEach.call(els, function(e){ showMermaidError(e); });
  };
  document.head.appendChild(s);
}
function runMermaid(){
  var els = document.querySelectorAll(".mermaid[data-b64]:not(.done)");
  if (!els.length) return;
  var theme = document.documentElement.getAttribute("data-theme") === "light" ? "default" : "dark";
  Array.prototype.forEach.call(els, function(el){
    el.classList.add("done");
    el.innerHTML = '<div class="mermaid-loading">図をレンダリング中…</div>';
  });
  loadMermaid(function(){
    if (window.mermaid) { try { mermaid.initialize({ startOnLoad:false, theme: theme }); } catch(e){} }
    Array.prototype.forEach.call(els, function(el){
      var srcText = decodeB64(el.getAttribute("data-b64")||"");
      (function(elm, src){
        var id = "mm" + Math.random().toString(36).slice(2,8);
        try {
          var pr = mermaid.render(id, src);
          if (pr && pr.then) pr.then(function(res){ elm.innerHTML = res.svg; }).catch(function(){ showMermaidError(elm); });
          else { elm.innerHTML = pr; }
        } catch(e){ showMermaidError(elm); }
      })(el, srcText);
    });
  });
}

/* ---------- DOM helpers ---------- */
var chatEl = document.getElementById("chat");
var inputEl = document.getElementById("input");
var sendBtn = document.getElementById("sendBtn");
// 画面下部のセッション欄 (settings ボタンの右側)
var sessListBox   = document.getElementById("settingsSessionList");
var sessAutotitle = document.getElementById("settingsAutotitle");
var sessRenameBtn = document.getElementById("settingsRename");
var sessDeleteBtn = document.getElementById("settingsDelete");
var sessNewBtn    = document.getElementById("settingsNew");
var settingsBtn   = document.getElementById("settingsBtn");
var modelSelect   = document.getElementById("modelSelect");
var modelItems = [];     // 設定に登録されているモデル [{name,llmApiUrl,llmApiKey,contextWindow}]
var currentModel = "";   // 現在選択中のモデル名
var sessItems = [];      // 表示中のセッション [{id,title,count}]
var sessSelId = "";      // ドロップダウンで選択中の ID
var allowTools = true;   // 設定モーダルでのみ変更する
var thinkBodyRef = null;   // 生成中の思考本文 (.think-body)。内部スクロールを追従させるため参照を保持

function emptyState(show) {
  if (show) {
    chatEl.innerHTML = ""; // 初期状態は空白
  } else {
    chatEl.innerHTML = "";
  }
}

function fmtNow() {
  var d = new Date();
  function p(x){ return (x < 10 ? "0" : "") + x; }
  return d.getFullYear() + "/" + p(d.getMonth()+1) + "/" + p(d.getDate())
       + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}

var COPY_ICON = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
var CHECK_ICON = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>';

// クリップボードへコピー（失敗時は execCommand にフォールバック）
function copyToClipboard(text, btn) {
  function done() {
    if (!btn) return;
    btn.classList.add("copied");
    btn.innerHTML = CHECK_ICON;
    btn.title = "コピーしました";
    setTimeout(function(){
      btn.classList.remove("copied");
      btn.innerHTML = COPY_ICON;
      btn.title = "内容をコピー";
    }, 1200);
  }
  function fallback() {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { }
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else {
    fallback();
  }
}

// ツール実行記録(配列) → HTML。live 表示とリロード後の復元で共用する
function progressHtml(list) {
  if (!list || !list.length) return "";
  var html = "";
  for (var i = 0; i < list.length; i++) {
    var s = String(list[i]);
    var m = s.match(/^ツール実行:\s+(.*?)\s{2,}([\s\S]*)$/);
    if (m) {
      html += '<div class="pstep">▶ ツール実行: ' + escapeHtml(m[1]) + '</div>' +
              '<div class="pdetail">' + escapeHtml(m[2]) + '</div>';
    } else {
      html += '<div class="pstep">▶ ' + escapeHtml(s) + '</div>';
    }
  }
  return html;
}

function bubble(role, text, ts, rawText) {
  var row = document.createElement("div");
  row.className = "msg " + role;
  var b = document.createElement("div");
  b.className = "bubble";
  b.innerHTML = text;
  b._copyText = (rawText == null) ? b.textContent : rawText;

  var cbtn = document.createElement("button");
  cbtn.type = "button";
  cbtn.className = "copy-btn";
  cbtn.title = "内容をコピー";
  cbtn.innerHTML = COPY_ICON;
  cbtn.addEventListener("click", function(ev){
    ev.stopPropagation();
    copyToClipboard(String(b._copyText == null ? b.textContent : b._copyText), cbtn);
  });
  b.appendChild(cbtn);

  if (ts) {
    var tsp = document.createElement("div");
    tsp.className = "ts";
    tsp.textContent = ts;
    b.appendChild(tsp);
  }
  row.appendChild(b);
  chatEl.appendChild(row);
  return b;
}

function userMsg(text, ts) {
  var el = bubble("user", escapeHtml(text), ts || fmtNow(), text);
  return el;
}
function assistantMsg(md, ts, steps, think) {
  var el = bubble("assistant", '<div class="md">' + renderMarkdown(md) + '</div>', ts || fmtNow(), md);
  var mdEl = el.querySelector(".md");
  var html = progressHtml(steps);   // 保存されたツール実行記録(リロード後も表示)
  if (html) {
    var pb = document.createElement("div");
    pb.className = "progress";
    pb.innerHTML = html;
    el.insertBefore(pb, mdEl);
  }
  // 保存された思考(reasoning)を復元する。ライブ表示と同じ見た目にする
  if (think != null && String(think).length > 0) {
    var det = document.createElement("details");
    det.className = "think";
    det.open = true;
    var sum = document.createElement("summary");
    sum.textContent = "Thinking...";
    var tb = document.createElement("div");
    tb.className = "think-body";
    tb.textContent = String(think);   // textContent で安全に(改行は CSS の pre-wrap で保持)
    det.appendChild(sum);
    det.appendChild(tb);
    el.insertBefore(det, mdEl);
  }
  return el;
}
// 待機中の表示 (Pi Web の "Waiting for model..." と同じ)
function waitingHtml() { return '<span class="wtext">Waiting for model...</span>'; }
function addTyping() {
  var row = document.createElement("div");
  row.className = "msg assistant";
  row.id = "typing";
  row.innerHTML = '<div class="bubble"><div class="waiting">' + waitingHtml() + '</div><div class="progress" id="progressBox"></div></div>';
  chatEl.appendChild(row);
  scrollBottom();
  return row;
}
function scrollBottom() {
  var m = document.getElementById("main");
  m.scrollTop = m.scrollHeight;
  // 思考本文は max-height で内部スクロールするため、そちらも最下部へ追従させる
  if (thinkBodyRef) thinkBodyRef.scrollTop = thinkBodyRef.scrollHeight;
  runMermaid();
}
function resizeInput() {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + "px";
}

/* ---------- chat state ---------- */
var busy = false;
var hasMessages = false;
var serverBusy = false;   // サーバ側の処理中フラグ (/api/health の busy)
var streamingHere = false; // このタブが実際に SSE を受信して描画中か(途中経過の取り込み制御)
var busyTimer = null;     // 処理中ステータスのポーリングタイマー

// 現在のセッションID (ローカルに保持、サーバ管理のセッションと紐付け)
var sessionId = localStorage.getItem("aiagent.session") || "";
var serverLastSession = "";   // サーバに記録された「最後に開いていたセッション」
var draftTimer = null;        // 下書き保存のデバウンス用

function emptyChat() { chatEl.innerHTML = ""; hasMessages = false; emptyState(true); }

// ドロップダウンを入力欄に差し替えてタイトルをインライン編集する
function startRename(id, currentTitle) {
  if (!id || !sessListBox) return;
  var input = document.createElement("input");
  input.className = "sess-edit";
  input.value = currentTitle || "";
  input.maxLength = 200;
  sessListBox.classList.add("editing");   // 編集中はドロップダウンを隠す
  sessListBox.parentNode.insertBefore(input, sessListBox);
  input.focus();
  input.select();

  var finished = false;
  var finish = function(){
    if (finished) return;
    finished = true;
    sessListBox.classList.remove("editing");
    if (input.parentNode) input.parentNode.removeChild(input);
    refreshSettingsSessions(id);
  };
  var commit = function(){
    if (finished) return;
    var v = input.value.trim();
    if (v.length === 0) { finish(); return; }
    fetch("/api/sessions/" + encodeURIComponent(id) + "/rename", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title: v })
    }).catch(function(){}).then(function(){ finish(); });
  };
  input.addEventListener("keydown", function(e){
    if (e.key === "Enter") { e.preventDefault(); commit(); }
    else if (e.key === "Escape") { e.preventDefault(); finished = true;
      sessListBox.classList.remove("editing");
      if (input.parentNode) input.parentNode.removeChild(input);
      refreshSettingsSessions(id); }
  });
  input.addEventListener("blur", commit);
}

// 会話内容からセッション名を自動設定
function autoTitle(id, btn) {
  if (!id) return;
  var prev = btn ? btn.textContent : null;
  if (btn) { btn.disabled = true; btn.textContent = "…"; }
  fetch("/api/sessions/" + encodeURIComponent(id) + "/autotitle", { method: "POST" })
    .then(function(r){ return r.json().catch(function(){ return null; }); })
    .then(function(d){
      if (d && d.ok) {
        refreshSettingsSessions(id);   // セッション欄を更新
      }
      else { alert("名前の自動設定に失敗しました: " + ((d && (d.message || d.error)) || "不明なエラー")); }
    })
    .catch(function(){ alert("名前の自動設定に失敗しました(通信エラー)"); })
    .then(function(){ if (btn) { btn.disabled = false; btn.textContent = prev || "⟳"; } });
}

function deleteSession(id, title) {
  var name = (title && String(title).trim().length > 0) ? String(title).trim() : "（無題）";
  var ok = false;
  try {
    ok = confirm("このセッションを削除しますか？\n\n" + name + "\n\n削除した会話履歴は元に戻せません。");
  } catch (e) {
    ok = true;   // confirm が使えない環境ではそのまま削除
  }
  if (!ok) return Promise.resolve(false);
  return fetch("/api/sessions/" + encodeURIComponent(id), { method: "DELETE" })
    .catch(function(){})
    .then(function(){
      // 表示中のセッションを消した時だけ会話も作り直す(それ以外は一覧だけ更新)
      if (id === sessionId) refreshSessions();
      else refreshSettingsSessions();
      return true;
    });
}

// 取得済みメッセージ [{role,content},...] を表示に反映
function loadSession(messages, turn) {
  hasMessages = false;
  thinkBodyRef = null;          // 会話を作り直すので思考本文への参照も解除
  chatEl.innerHTML = "";
  if (!messages || messages.length === 0) {
    // 生成中で、まだ何も保存されていない場合でも途中経過を出せるようにする
    if (turn && (turn.content || turn.think || (turn.steps && turn.steps.length))) {
      emptyState(false); hasMessages = true;
    } else { emptyState(true); return; }
  } else {
    emptyState(false); hasMessages = true;
    messages.forEach(function(m){
      if (m.role === "user") userMsg(m.content, m.ts);
      else if (m.role === "assistant") assistantMsg(m.content, m.ts, m.steps, m.think);
    });
  }
  // 生成中のターン(サーバ側で保持している途中経過)を復元する。
  // リロードしても「生成途中から」表示を再開できる。
  if (turn && (turn.content || turn.think || (turn.steps && turn.steps.length))) {
    var last = assistantMsg(turn.content || "", fmtNow(), turn.steps, turn.think);
    thinkBodyRef = last.querySelector(".think-body") || null;
  }
  if (serverBusy) ensureTyping();
  scrollBottom();
  // 履歴の思考ブロックは最新部分(最下部)を表示しておく
  var tbs = chatEl.querySelectorAll(".think-body");
  for (var ti = 0; ti < tbs.length; ti++) tbs[ti].scrollTop = tbs[ti].scrollHeight;
}

// 生成中の途中経過を取り込むための再取得。
// 会話を作り直すので、スクロール位置は最下部へ合わせる。
function refreshSessionQuiet() {
  if (!sessionId) return;
  fetch("/api/sessions/" + encodeURIComponent(sessionId))
    .then(function(r){ return r.json().catch(function(){ return null; }); })
    .then(function(d){
      if (!d || !d.ok) return;
      loadSession(d.messages || [], d.turn || null);
    })
    .catch(function(){});
}

function fetchSession(id) {
  fetch("/api/sessions/" + encodeURIComponent(id))
    .then(function(r){ return r.json().catch(function(){ return null; }); })
    .then(function(d){
      if (d && d.ok) loadSession(d.messages || [], d.turn || null);
      else emptyChat();
    })
    .catch(function(){ emptyChat(); });
}

function selectSession(id) {
  if (!id || busy) return;
  sessionId = id;
  localStorage.setItem("aiagent.session", id);
  saveUiState({ session: id });   // サーバ側にも記録(ブラウザを閉じても復元できる)
  updateActiveItem();   // 一覧の active を即時更新(再描画しない)
  fetchSession(id);
}

// UI の状態(下書き / 選択中セッション)をサーバ側へ保存する。
// localStorage が消えても再開できるようにするため。
function saveUiState(obj) {
  try {
    fetch("/api/ui", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(obj)
    }).catch(function(){});
  } catch(e) {}
}

// 現在の sessionId に合わせてドロップダウンの選択を付け替える
function updateActiveItem() {
  if (!sessListBox) return;
  var found = false;
  for (var i = 0; i < sessListBox.options.length; i++) {
    if (sessListBox.options[i].value === sessionId) { found = true; break; }
  }
  if (found) sessListBox.value = sessionId;
  sessSelId = sessionId;
  updateSessButtons();
}

function refreshSessions() {
  fetch("/api/sessions")
    .then(function(r){ return r.json().catch(function(){ return null; }); })
    .then(function(d){
      if (!d || !d.ok) { emptyChat(); return; }
      var sessions = d.sessions || [];
      // 再開先の優先順位:
      //   1. サーバに記録された「最後に開いていたセッション」(ブラウザを閉じても残る)
      //   2. ブラウザの localStorage
      //   3. 一覧の先頭
      var candidates = [serverLastSession, sessionId];
      var target = "";
      for (var i = 0; i < candidates.length && !target; i++) {
        var c = candidates[i];
        if (c && sessions.some(function(s){ return s.id === c; })) target = c;
      }
      if (!target) {
        if (sessions.length > 0) target = sessions[0].id; // 最近のセッションへ
        else { createSession(true); return; }              // 1つも無ければ作成
      }
      sessionId = target;
      localStorage.setItem("aiagent.session", target);
      saveUiState({ session: target });
      refreshSettingsSessions(target);   // セッション欄の選択も合わせる
      fetchSession(target);
    })
    .catch(function(){ emptyChat(); });
}

// サーバの処理中ステータスをポーリングし、完了したら反映する
function pollServerBusy() {
  fetch("/api/health").then(function(r){ return r.json().catch(function(){ return null; }); })
    .then(function(d){
      var was = serverBusy;
      serverBusy = !!(d && d.busy);
      if (serverBusy) {
        setBusy(true);
        ensureTyping();
        renderProgress(d && d.progress);
        // このタブが描画していない(=リロード後など)なら、
        // サーバに保存されている途中経過を取り込んで表示を追従させる。
        if (!streamingHere && sessionId) refreshSessionQuiet();
        startBusyPoll();
      } else {
        stopBusyPoll();
        if (was) {
          setBusy(false);
          hideTyping();
          refreshSessionList(); // 一覧のみ更新(会話の再描画はしない)
        }
      }
    })
    .catch(function(){}); // エラー時もポーリングを継続
}

// 起動時: サーバ状態(モデル・ツール・APIキー・busy)を取得してから表示
function initServerState() {
  fetch("/api/health").then(function(r){ return r.json().catch(function(){ return null; }); })
    .then(function(d){
      if (d && d.ok) {
        allowTools = !(d.allowTools === false);
        renderModels(d.models || [], d.model || "");   // モデル一覧と選択中モデル
        serverLastSession = d.lastSession || "";       // サーバ側の再開先
        // 配色もサーバ側の設定に合わせる(ブラウザを変えても維持される)
        fetch("/api/config").then(function(r){ return r.json().catch(function(){ return null; }); })
          .then(function(cd){
            if (cd && cd.ok && cd.config && cd.config.theme) setTheme(cd.config.theme);
          }).catch(function(){});
        serverBusy = !!(d.busy);

        // 入力途中のテキストを復元する(ブラウザを閉じても残る)
        if (d.draft && !inputEl.value) {
          inputEl.value = d.draft;
          resizeInput();
        }

        if (serverBusy) {
          setBusy(true);
          if (!document.getElementById("typing")) addTyping();
          renderProgress(d && d.progress);
          startBusyPoll();
        }
      }
      refreshSessions(); // サーバ状態確定後にセッションを読み込み
    })
    .catch(function(){ refreshSessions(); });
}

function send() {
  var text = inputEl.value.trim();
  if (!text || busy) return;
  if (!hasMessages) { emptyState(false); hasMessages = true; }
  userMsg(text);
  inputEl.value = ""; resizeInput();
  saveUiState({ draft: "" });   // 送信したので下書きは消す
  scrollBottom();
  setBusy(true);
  streamingHere = true;   // このタブが描画を担当している

  thinkBodyRef = null;                            // 前のターンの思考本文への参照を解除
  var bubbleEl = assistantMsg("");                // 空の assistant 吹き出し
  var mdEl = bubbleEl.querySelector(".md");
  var prog = document.createElement("div");       // ツール実行の表示(思考ブロックの外・吹き出し上部)
  prog.className = "progress";
  prog.style.display = "none";
  bubbleEl.insertBefore(prog, mdEl);

  // 待機表示: Pi Web と同じ "Waiting for model..."
  var waitEl = document.createElement("div");
  waitEl.className = "waiting";
  waitEl.innerHTML = waitingHtml();
  bubbleEl.insertBefore(waitEl, mdEl);
  function hideWait() {
    if (waitEl && waitEl.parentNode) waitEl.parentNode.removeChild(waitEl);
    waitEl = null;
  }

  // ツール実行の表示: SSE の tool イベントに加え、/api/health の progress を定期取得して
  // 取りこぼしがあっても必ず表示されるようにする(サーバ状態が唯一の真実)。
  var progTimer = null;
  function renderProgressList(list) {
    var html = progressHtml(list);
    if (!html) return;
    prog.innerHTML = html;
    prog.style.display = "block";
    scrollBottom();
  }
  function pollProgress() {
    fetch("/api/health")
      .then(function(r){ return r.json().catch(function(){ return null; }); })
      .then(function(h){ if (h) renderProgressList(h.progress); })
      .catch(function(){});
  }
  function startProgressPoll() {
    if (!progTimer) progTimer = setInterval(pollProgress, 1200);
  }
  function stopProgressPoll() {
    if (progTimer) { clearInterval(progTimer); progTimer = null; }
  }
  startProgressPoll();

  // 思考(thinking)ブロック: reasoning トークンが来たら生成
  var thinkEl = null, thinkBody = null, thinkText = "";
  function ensureThink() {
    if (thinkEl) return;
    thinkEl = document.createElement("details");
    thinkEl.className = "think";
    thinkEl.open = true;
    var sum = document.createElement("summary");
    sum.textContent = "Thinking...";
    rateEl = document.createElement("span");   // tok/s 表示 (Pi Web 風)
    rateEl.className = "rate";
    sum.appendChild(rateEl);
    thinkBody = document.createElement("div");
    thinkBody.className = "think-body";
    thinkEl.appendChild(sum);
    thinkEl.appendChild(thinkBody);
    bubbleEl.insertBefore(thinkEl, mdEl);
    thinkBodyRef = thinkBody;   // scrollBottom() から追従できるようにする
  }

  var fullText = "";
  var lastPaint = 0;

  // --- tok/s 表示 (Pi Web 風) ---
  // 出力文字数から概算する (4文字 ≒ 1トークン)。直近3秒の移動平均。
  var rateChars = 0;
  var rateSamples = [];
  var rateTimer = null;
  var rateEl = null;
  function rateTick() {
    var now = Date.now();
    rateSamples.push({ t: now, c: rateChars });
    while (rateSamples.length > 1 && now - rateSamples[0].t > 3000) rateSamples.shift();
    if (!rateEl || rateSamples.length < 2) return;
    var a = rateSamples[0], b = rateSamples[rateSamples.length - 1];
    var dt = (b.t - a.t) / 1000;
    if (dt <= 0.2) return;
    var v = (b.c - a.c) / 4 / dt;
    rateEl.textContent = v > 0 ? (" · " + v.toFixed(1) + " tok/s") : "";
  }
  function startRate() { if (!rateTimer) rateTimer = setInterval(rateTick, 250); }
  function stopRate() { if (rateTimer) { clearInterval(rateTimer); rateTimer = null; } }
  startRate();
  function paint(force) {
    var now = Date.now();
    if (!force && now - lastPaint < 40) return;
    lastPaint = now;
    mdEl.innerHTML = renderMarkdown(fullText);
    bubbleEl._copyText = fullText;   // コピー用に生のマークダウンを保持
    scrollBottom();
  }

  fetch("/api/chat/stream", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: text, session: sessionId })
  }).then(function(resp){
    if (!resp.ok || !resp.body) throw new Error("HTTP " + resp.status);
    var reader = resp.body.getReader();
    var decoder = new TextDecoder();
    var buf = "";

    function handle(ev, dat) {
      var d = null; try { d = JSON.parse(dat); } catch(e){}
      if (ev === "content" && d) {
        var ct = (d.t || "");
        fullText += ct;
        rateChars += ct.length;
        if (fullText.length > 0) hideWait();   // 最初の本文が来たら待機表示を消す
        paint(false);
      }
      else if (ev === "reasoning" && d) {
        var rt = (d.t || "");
        if (rt.length > 0) {
          hideWait();
          ensureThink();
          rateChars += rt.length;
          thinkText += rt;
          thinkBody.textContent = thinkText;
          scrollBottom();
        }
      }
      else if (ev === "tool" && d) {
        prog.style.display = "block";
        var _nm = escapeHtml(String(d.name||""));
        var _dt = escapeHtml(String(d.detail||""));
        prog.innerHTML = '<div class="pstep">▶ ツール実行: ' + _nm + '</div>' +
                         (_dt ? '<div class="pdetail">' + _dt + '</div>' : '');
        scrollBottom();
        pollProgress();   // サーバ側の進捗リストで確定させる
      }
      else if (ev === "error" && d) {
        hideWait();
        stopRate();
        stopProgressPoll();
        bubbleEl.innerHTML = '<div class="md"><div class="err">⚠ ' + escapeHtml(String(d.message||"エラー")) + '</div></div>';
      }
      else if (ev === "done" && d) {
        hideWait();
        stopRate();
        pollProgress();          // 最後の進捗を反映
        stopProgressPoll();
        // 思考は自動で折りたたまない(必要なとき手動で閉じる)
        if (d.session) { sessionId = d.session; localStorage.setItem("aiagent.session", sessionId); }
        refreshSessionList();   // 会話は再描画しない(ツール実行の表示を残す)
      }
    }

    function pump() {
      return reader.read().then(function(res){
        if (res.done) { paint(true); return; }
        buf += decoder.decode(res.value, {stream:true});
        buf = buf.replace(/\r\n/g, "\n");   // サーバは CRLF で送出するため LF に正規化
        var idx;
        while ((idx = buf.indexOf("\n\n")) >= 0) {
          var block = buf.slice(0, idx); buf = buf.slice(idx + 2);
          var ev = null, dat = null;
          block.split("\n").forEach(function(l){
            if (l.indexOf("event:") === 0) ev = l.slice(6).trim();
            else if (l.indexOf("data:") === 0) dat = l.slice(5).trim();
          });
          if (dat !== null && !(ev === "end")) handle(ev, dat);
        }
        return pump();
      });
    }
    return pump();
  }).then(function(){ paint(true); })
    .catch(function(err){
      stopRate();
      stopProgressPoll();
      bubbleEl.innerHTML = '<div class="md"><div class="err">⚠ 通信エラー: ' + escapeHtml(String(err)) + '</div></div>';
      refreshSessionList();
    })
    .then(function(){ streamingHere = false; stopProgressPoll(); stopBusyPoll(); serverBusy = false; setBusy(false); refreshSessionList(); });
}

// モデル一覧エディタの 1 行を追加する
function addModelRow(name){
  var rows = document.getElementById("modelRows");
  if (!rows) return;

  var row = document.createElement("div");
  row.className = "model-row";

  var n = document.createElement("input");
  n.type = "text";

  del.textContent = "×";
  del.title = "このモデルを削除";
  del.addEventListener("click", function(){
    row.parentNode.removeChild(row);
    syncModelSelectOptions();
  });
  row.appendChild(del);

  rows.appendChild(row);
  syncModelSelectOptions();

// エディタの内容から Model セレクトの選択肢を作り直す
function syncModelSelectOptions(){
  var sel = settingsEls["model"];
  var rows = document.getElementById("modelRows");
  if (!sel || !rows) return;

  var keep = sel.value;
  sel.innerHTML = "";
  Array.prototype.forEach.call(rows.querySelectorAll(".model-row"), function(r){
    var name = (r.querySelector(".m-name").value || "").trim();
    if (!name) return;
    var o = document.createElement("option");
    o.value = name;
    o.textContent = name;
    sel.appendChild(o);
  });
  if (keep) {
    // 選択肢に残っていれば維持する
    var found = false;
    for (var i = 0; i < sel.options.length; i++) {
      if (sel.options[i].value === keep) { found = true; break; }
    }
    if (found) sel.value = keep;
  }
  if (!sel.value && sel.options.length > 0) sel.value = sel.options[0].value;
}

// エディタの内容をモデル名の配列として取り出す
// (接続先・APIキー・コンテキスト上限は全モデル共通なので、ここでは持たない)
function collectModels(){
  var rows = document.getElementById("modelRows");
  var out = [];
  if (!rows) return out;
  Array.prototype.forEach.call(rows.querySelectorAll(".model-row"), function(r){
    var name = (r.querySelector(".m-name").value || "").trim();
    if (!name) return;               // 名前が空の行は無視
    if (out.indexOf(name) >= 0) return;  // 重複は除く
    out.push(name);
  });
  return out;
}

function openSettings(){
  if (busy) return;   // 思考中は停止ボタン以外を操作できない
  fetch("/api/config")
    .then(function(r){ return r.json().catch(function(){ return null; }); })
    .then(function(d){
      if (!d || !d.ok) { alert("設定の取得に失敗しました"); return; }
      var c = d.config || {};

      // モデル一覧エディタを作り直す
      var rows = document.getElementById("modelRows");
      if (rows) {
        rows.innerHTML = "";
        (c.models || []).forEach(function(m){
          addModelRow(modelNameOf(m));
        });
        if (!(c.models || []).length) addModelRow("");
        syncModelSelectOptions();
      }

      SETTINGS_FIELDS.forEach(function(f){
        var el = settingsEls[f.k];
        if (f.client) {
          // テーマはサーバ側(agentweb.json の theme)が正。無ければ現在の表示に合わせる
          el.value = (c.theme === "light" || c.theme === "dark") ? c.theme : currentTheme();
          return;
        }
        var v = c[f.k];
        if (f.type === "bool") el.checked = !!v;
        else el.value = (v == null) ? "" : String(v);
      });
      settingsOriginPort = c.port;
      settingsHint.textContent = d.path ? ("保存先: " + d.path) : "";
      settingsModal.style.display = "grid";
    })
    .catch(function(){ alert("設定の取得に失敗しました(通信エラー)"); });
}

/* ---------- モデル選択（画面下部・セッション欄の左） ---------- */

// 設定に登録されたモデル一覧をセレクトへ反映する
// モデル一覧の要素からモデル名を取り出す。
// 現在は文字列の配列だが、旧形式({"name": ...})も受け付ける。
function modelNameOf(m){
  if (m == null) return "";
  if (typeof m === "string") return m;
  return m.name || "";
}

function renderModels(models, selected){
  if (!modelSelect) return;
  modelItems = models || [];
  currentModel = selected || "";

  modelSelect.innerHTML = "";
  modelItems.forEach(function(m){
    var name = modelNameOf(m);
    if (!name) return;
    var o = document.createElement("option");
    o.value = name;
    o.textContent = name;
    modelSelect.appendChild(o);
  });

  // 選択中のモデルが一覧に無ければ先頭を選ぶ
  if (!currentModel && modelItems.length > 0) currentModel = modelNameOf(modelItems[0]);
  if (currentModel) modelSelect.value = currentModel;
  modelSelect.disabled = busy || modelItems.length === 0;
}

// 選択したモデルへ切り替える(サーバ側にも保存される)
function pickModel(name){
  if (!name || name === currentModel) return;
  var prev = currentModel;
  currentModel = name;
  modelSelect.disabled = true;
  fetch("/api/model", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ model: name })
  })
    .then(function(r){ return r.json().catch(function(){ return null; }); })
    .then(function(d){
      modelSelect.disabled = busy;
      if (!d || !d.ok) {
        currentModel = prev;
        modelSelect.value = prev;
        alert("モデルの切り替えに失敗しました: " + ((d && (d.message || d.error)) || "不明なエラー"));
        return;
      }
      currentModel = d.model || name;
      modelSelect.value = currentModel;
      if (d.config) renderModels(d.config.models || [], currentModel);
    })
    .catch(function(){
      modelSelect.disabled = busy;
      currentModel = prev;
      modelSelect.value = prev;
      alert("モデルの切り替えに失敗しました(通信エラー)");
    });
}

modelSelect.addEventListener("change", function(){
  pickModel(modelSelect.value);
});

/* ---------- 画面下部 (settings ボタンの右側): セッションのドロップダウンと操作 ---------- */

function updateSessButtons(){
  if (!sessAutotitle || !sessDeleteBtn) return;
  var has = false;
  for (var i = 0; i < sessItems.length; i++) {
    if (sessItems[i].id === sessSelId) { has = true; break; }
  }
  // 思考中(busy)は停止ボタン以外を操作できないようにする
  var usable = has && !busy;
  sessAutotitle.disabled = !usable;
  if (sessRenameBtn) sessRenameBtn.disabled = !usable;
  sessDeleteBtn.disabled = !usable;
  if (sessNewBtn) sessNewBtn.disabled = busy;
  // ドロップダウンと settings ボタンも思考中は無効
  if (sessListBox) sessListBox.disabled = busy;
  if (settingsBtn) settingsBtn.disabled = busy;
  if (modelSelect) modelSelect.disabled = busy || modelItems.length === 0;
}

function renderSettingsSessions(sessions, selected){
  if (!sessListBox) return;
  sessItems = sessions;
  sessSelId = selected || "";
  sessListBox.innerHTML = "";
  sessions.forEach(function(s){
    var o = document.createElement("option");
    o.value = s.id;
    o.textContent = (s.title || "会話") + ((s.count || 0) > 0 ? " · " + s.count : "");
    sessListBox.appendChild(o);
  });
  if (sessSelId) sessListBox.value = sessSelId;
  updateSessButtons();
}

// ドロップダウンの選択を確定し、会話もそのセッションへ切り替える
function pickSettingsSession(id){
  sessSelId = id;
  updateSessButtons();
  selectSession(id);   // 実行中(busy)の時は切り替わらない
}

function refreshSettingsSessions(selected){
  fetch("/api/sessions")
    .then(function(r){ return r.json().catch(function(){ return null; }); })
    .then(function(d){
      if (!d || !d.ok) return;
      var sessions = d.sessions || [];
      var cands = [selected, sessSelId, sessionId];
      var target = "";
      for (var i = 0; i < cands.length && !target; i++) {
        var c = cands[i];
        if (!c) continue;
        for (var j = 0; j < sessions.length; j++) {
          if (sessions[j].id === c) { target = c; break; }
        }
      }
      if (!target && sessions.length > 0) target = sessions[0].id;
      renderSettingsSessions(sessions, target);
    })
    .catch(function(){});
}

sessListBox.addEventListener("change", function(){
  pickSettingsSession(sessListBox.value);
});

sessAutotitle.addEventListener("click", function(){
  if (!sessSelId) return;
  autoTitle(sessSelId, sessAutotitle);
});

// 選択中セッションのタイトルを取り出す
function sessTitleOf(id) {
  for (var i = 0; i < sessItems.length; i++) {
    if (sessItems[i].id === id) return sessItems[i].title || "";
  }
  return "";
}

sessRenameBtn.addEventListener("click", function(){
  if (!sessSelId) return;
  startRename(sessSelId, sessTitleOf(sessSelId));
});

sessDeleteBtn.addEventListener("click", function(){
  if (!sessSelId) return;
  deleteSession(sessSelId, sessTitleOf(sessSelId));
});

sessNewBtn.addEventListener("click", function(){
  // 新規作成後は必ず新しいセッションを選択状態にする
  createSession().then(function(){ refreshSettingsSessions(sessionId); });
});

function saveSettings(){
  var body = {};
  SETTINGS_FIELDS.forEach(function(f){
    if (f.client) return;   // テーマはブラウザ側の設定なので保存しない
    var el = settingsEls[f.k];
    if (f.type === "bool") body[f.k] = el.checked;
    else if (f.type === "number") body[f.k] = parseInt(el.value, 10) || 0;
    else body[f.k] = el.value;
  });

  // モデル一覧(名前の配列)も一緒に保存する
  var models = collectModels();
  if (models.length > 0) {
    body.models = models;
    // 選択中のモデルが一覧に無ければ先頭に合わせる
    if (models.indexOf(body.model) < 0) body.model = models[0];
  }
  var btn = document.getElementById("settingsSave");
  btn.disabled = true;
  fetch("/api/config", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  })
    .then(function(r){ return r.json().catch(function(){ return null; }); })
    .then(function(d){
      btn.disabled = false;
      if (!d || !d.ok) { alert("設定の保存に失敗しました: " + ((d && d.message) || "不明なエラー")); return; }
      closeSettings();
      // ツール可否は即時反映される(メイン画面にはバッジが無い)
      if (d.config && typeof d.config.allowTools === "boolean") {
        allowTools = d.config.allowTools;
      }
      // メイン画面のモデル選択も保存結果に合わせる
      if (d.config && d.config.models) {
        renderModels(d.config.models, d.config.model || "");
      }
      if (settingsOriginPort != null && d.config && d.config.port !== settingsOriginPort) {
        alert("ポート番号を変更しました。反映には agentweb.exe の再起動が必要です。");
      }
    })
    .catch(function(){ btn.disabled = false; alert("設定の保存に失敗しました(通信エラー)"); });
}

document.getElementById("settingsBtn").addEventListener("click", openSettings);
document.getElementById("settingsClose").addEventListener("click", closeSettings);
document.getElementById("settingsCancel").addEventListener("click", closeSettings);
document.getElementById("settingsSave").addEventListener("click", saveSettings);
settingsModal.addEventListener("click", function(e){ if (e.target === settingsModal) closeSettings(); });
document.addEventListener("keydown", function(e){
  if (e.key === "Escape" && settingsModal.style.display !== "none") closeSettings();
});

/* ---------- init ---------- */
resizeInput();
inputEl.focus();
emptyState(true);
sendBtn.disabled = false;
initServerState(); // サーバ状態を反映しつつセッションを読み込む
</script>
</body>
