<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1a1a1a" />
<title>agentweb</title>
<script>
try{var __t=localStorage.getItem("aiagent.theme")||"dark";document.documentElement.setAttribute("data-theme",__t);}catch(e){}
</script>
<style>
  /* =====================================================================
     Pi Web 風テーマ
       色・形状は Pi Web の CSS 変数 (--bg / --bg-panel / --border /
       --text / --accent / --user-bg / --tool-bg ...) と同じ値を使用。
     ===================================================================== */
  :root {
    color-scheme: dark;
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Noto Sans Mono", monospace;

    /* Pi Web と同じ変数名 */
    --bg: #1a1a1a;
    --bg-panel: #242424;
    --bg-hover: #2e2e2e;
    --bg-selected: #383838;
    --border: #3a3a3a;
    --text: #e8e8e8;
    --text-muted: #9ca3af;
    --text-dim: #6b7280;
    --accent: #60a5fa;
    --accent-hover: #93c5fd;
    --accent-dim: #1c3a5e;
    --user-bg: #1e293b;
    --tool-bg: #1f2937;
    --subtle: rgba(255,255,255,.04);
    --danger: #f87171;
    --radius: 8px;
    /* 旧名 (エイリアス) */
    --panel: var(--bg-panel);
    --panel-2: var(--bg-hover);
    --panel-3: var(--bg-selected);
    --muted: var(--text-muted);
    --dim: var(--text-dim);

    background: var(--bg);
    color: var(--text);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff;
    --bg-panel: #f5f5f5;
    --bg-hover: #eeeeee;
    --bg-selected: #e8e8e8;
    --border: #e0e0e0;
    --text: #1a1a1a;
    --text-muted: #6b7280;
    --text-dim: #9ca3af;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-dim: #dbeafe;
    --user-bg: #eff6ff;
    --tool-bg: #f9fafb;
    --subtle: rgba(0,0,0,.03);
    --danger: #dc2626;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- top bar ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .logo {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    display: grid; place-items: center;
    flex: none;
  }
  .logo svg { width: 20px; height: 20px; fill: var(--accent); }
  .head-title { display: flex; flex-direction: column; line-height: 1.25; }
  .head-title .t { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
  .head-title .s { font-size: 12px; color: var(--muted); }
  .head-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .badge {
    font-size: 12px; color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 9px;
  }
  .badge b { color: var(--text); font-weight: 600; }

  .layout { display: flex; flex: 1; min-height: 0; }

  /* ---------- sidebar ---------- */
  .sidebar {
    width: 258px;
    flex: none;
    border-right: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .sidebar-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px 12px 54px;   /* 左はフローティング × の分を空ける */
    border-bottom: 1px solid var(--border);
  }
  .sidebar-title { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
  .new-btn {
    width: 28px; height: 28px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font: inherit; font-size: 16px; line-height: 1;
    cursor: pointer;
    display: grid; place-items: center;
  }
  .new-btn:hover { background: var(--panel-3); }
  .session-list { flex: 1; overflow-y: auto; padding: 6px; min-height: 0; }
  .session-list::-webkit-scrollbar { width: 10px; }
  .session-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  .session-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    color: var(--muted);
    margin-bottom: 2px;
    transition: background .12s ease, color .12s ease;
  }
  .session-item:hover { background: var(--panel-2); color: var(--text); }
  .session-item.active { background: var(--panel-3); color: var(--accent); }
  .session-item .s-txt {
    flex: 1; min-width: 0;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .session-item .s-del, .session-item .s-ren, .session-item .s-auto {
    flex: none;
    width: 20px; height: 20px;
    border: none;
    border-radius: 4px;
    background: transparent;
    color: var(--muted);
    font: inherit; font-size: 14px; line-height: 1;
    cursor: pointer;
    display: grid; place-items: center;
    opacity: 0;
  }
  .session-item:hover .s-del, .session-item:hover .s-ren, .session-item:hover .s-auto { opacity: 1; }
  .session-item .s-del:hover { background: var(--panel-2); color: var(--danger); }
  .session-item .s-ren:hover { background: var(--panel-2); color: var(--accent); }
  .session-item .s-auto:hover { background: var(--panel-2); color: var(--accent); }
  .session-item .s-auto:disabled { opacity: 1; cursor: progress; }
  .session-item .s-edit {
    flex: 1; min-width: 0;
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--accent);
    border-radius: 4px;
    font: inherit; font-size: 13px;
    padding: 2px 6px;
    outline: none;
  }

  /* ---------- chat ---------- */
  main { flex: 1; overflow-y: auto; }
  main::-webkit-scrollbar { width: 12px; }
  main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
  .chat {
    max-width: 820px;
    margin: 0 auto;
    padding: 26px 22px 44px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* message rows (Pi Web: user は flex-end / gap 6 / maxWidth 85%) */
  .msg { display: flex; gap: 6px; align-items: flex-end; }
  .msg.user { flex-direction: row-reverse; }
  .bubble {
    position: relative;
    max-width: 85%;
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }
  .msg.assistant .bubble {
    background: transparent;
    border: none;
    border-radius: 0;
    padding: 2px 16px 0 0;
    max-width: 100%;
    flex: 1;
    min-width: 0;
    color: var(--text);
  }
  .msg.user .bubble {
    background: var(--user-bg);
    border: 1px solid rgba(59,130,246,.2);
    color: var(--text);
    white-space: pre-wrap;
  }
  .msg.user .copy-btn:hover { background: var(--subtle); color: var(--text); }

  /* コピーボタン */
  .copy-btn {
    position: absolute;
    top: 2px; right: 2px;
    width: 18px; height: 18px;
    padding: 0;
    border: none;
    border-radius: 4px;
    background: transparent;
    color: var(--muted);
    line-height: 1;
    cursor: pointer;
    display: grid; place-items: center;
    opacity: 0;
    transition: opacity .12s ease;
  }
  .msg:hover .copy-btn, .copy-btn:focus { opacity: .6; }
  .copy-btn:hover { opacity: 1; background: var(--panel-2); color: var(--text); }
  .copy-btn.copied { opacity: 1; color: var(--accent); }
  .ts { font-size: 11px; color: var(--dim); margin-top: 4px; }
  .msg.user .ts { text-align: right; }
  .msg.assistant .ts { text-align: left; }

  /* ---------- markdown ---------- */
  .md { font-size: 14px; line-height: 1.6; }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md h1, .md h2, .md h3, .md h4 { color: var(--text); line-height: 1.3; margin: 20px 0 8px; font-weight: 650; letter-spacing: -0.01em; }
  .md h1 { font-size: 21px; } .md h2 { font-size: 18px; } .md h3 { font-size: 16px; }
  .md p { margin: 8px 0; }
  .md ul, .md ol { margin: 8px 0; padding-left: 22px; }
  .md li { margin: 3px 0; }
  .md a { color: var(--accent); }
  .md code {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    font-family: var(--font-mono);
    font-size: 12.5px;
  }
  .md pre {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    overflow-x: auto;
  }
  .md pre code { background: none; border: none; padding: 0; font-size: 12.5px; line-height: 1.55; }
  .md blockquote {
    margin: 10px 0; padding: 2px 14px;
    border-left: 3px solid var(--border);
    color: var(--muted);
  }
  .mermaid {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin: 10px 0;
    padding: 10px;
    overflow-x: auto;
    text-align: center;
  }
  .mermaid svg { max-width: 100%; height: auto; }
  .mermaid-loading { font-size: 12px; color: var(--muted); padding: 12px; }
  .mermaid-fallback { font-size: 12px; text-align: left; background: var(--panel-2); padding: 8px; border-radius: 6px; white-space: pre-wrap; }
  .mermaid-note { font-size: 11px; color: var(--danger); margin-top: 4px; }
  .md table { border-collapse: collapse; margin: 10px 0; font-size: 13px; }
  .md th, .md td { border: 1px solid var(--border); padding: 6px 10px; }
  .md th { background: var(--panel); }
  .md hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

  /* ---------- waiting / tool / thinking ---------- */
  .progress {
    margin: 0 0 8px;
    display: flex; flex-direction: column; gap: 2px;
    background: var(--tool-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 10px;
  }
  /* 待機表示 (Pi Web の chat.waitingModel と同じパルス文字) */
  .waiting { margin: 0 0 2px; font-size: 13px; color: var(--text-muted); }
  .waiting .wtext { animation: wpulse 1.5s infinite; }
  @keyframes wpulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  /* Thinking ヘッダの tok/s (Pi Web 風) */
  .think > summary .rate { color: var(--text-dim); font-family: var(--font-mono); font-size: 11px; margin-left: 6px; }
  .pstep { font-size: 11.5px; color: var(--accent); word-break: break-all; font-weight: 600; }
  .pdetail {
    font-size: 11.5px; color: var(--muted);
    font-family: var(--font-mono);
    white-space: pre-wrap; word-break: break-all;
    padding-left: 12px;
  }
  .think { margin: 0 0 10px; border-left: 2px solid var(--border); padding: 2px 10px; }
  .think > summary {
    cursor: pointer; font-size: 11.5px; color: var(--muted);
    list-style: none; user-select: none; outline: none;
  }
  .think > summary::-webkit-details-marker { display: none; }
  .think > summary:hover { color: var(--text); }
  .think-body {
    font-size: 12px; line-height: 1.55; color: var(--muted);
    white-space: pre-wrap; word-wrap: break-word;
    margin-top: 4px; max-height: 240px; overflow-y: auto;
  }
  @keyframes blink { 0%,80%,100% { opacity:.25 } 40% { opacity:1 } }

  .err { color: var(--danger); font-size: 13px; padding: 4px 2px; }

  /* ---------- composer ---------- */
  footer {
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
  }
  .composer {
    max-width: 860px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    flex-wrap: wrap;
  }
  .composer .side { display: flex; flex-direction: column; align-items: stretch; gap: 8px; flex: 1; min-width: 0; }
  .composer-bar {
    max-width: 860px;
    margin: 8px auto 0;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 11px;
    color: var(--muted);
  }
  .composer-bar .badge { font-size: 10px; padding: 2px 7px; }
  .tools-toggle { cursor: pointer; font: inherit; }
  .theme-link {
    cursor: pointer;
    font: inherit;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--muted);
    padding: 3px 9px;
  }
  .theme-link:hover { background: var(--panel-2); color: var(--text); }
  .sidebar.hidden { display: none; }
  .side-actions { display: flex; gap: 4px; align-items: center; }
  .composer-left { display: flex; flex-direction: column; gap: 4px; flex: none; padding-bottom: 4px; }
  textarea {
    width: 100%;
    resize: none;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font: inherit;
    font-size: 14px;
    line-height: 1.6;
    padding: 11px 13px;
    min-height: 52px;
    max-height: 200px;
    outline: none;
    transition: border-color .12s ease;
  }
  textarea::placeholder { color: var(--dim); }
  textarea:focus { border-color: var(--accent); }
  button.send {
    flex: none;
    height: 46px; min-width: 62px;
    border: 1px solid var(--accent);
    border-radius: 10px;
    background: var(--accent);
    color: #0b1220;
    font: inherit;
    font-weight: 650;
    font-size: 14px;
    cursor: pointer;
    display: grid; place-items: center;
  }
  button.send:disabled { opacity: .45; cursor: not-allowed; }
  button.send:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  :root[data-theme="light"] button.send { color: #ffffff; }
  /* 生成中(停止ボタン)は Pi Web と同じ赤 */
  button.send.stop {
    background: #ef4444;
    border-color: #ef4444;
    color: #ffffff;
  }
  button.send.stop:hover:not(:disabled) { background: #dc2626; border-color: #dc2626; }
  button.ghost {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--muted);
    height: 36px; padding: 0 14px;
    border-radius: 6px;
    font: inherit; font-size: 13px;
    cursor: pointer;
  }
  button.ghost:hover { background: var(--panel-2); color: var(--text); }

  /* モバイル用のサイドバー表示ボタン */
  .fab {
    position: fixed;
    top: 10px; left: 10px;
    z-index: 50;
    width: 34px; height: 34px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: color-mix(in srgb, var(--panel) 82%, transparent);
    color: var(--text);
    font-size: 16px; line-height: 1;
    cursor: pointer;
    display: none;
    place-items: center;
    opacity: .7;
    backdrop-filter: blur(3px);
  }
  .fab:hover { opacity: 1; }
  .fab.on { display: grid; }   /* 表示中(ハンバーガー/×で排他) */

  /* ---------- 設定モーダル (Pi Web のモーダルに合わせた見た目) ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0,0,0,.5);
    display: grid;
    place-items: center;
    padding: 16px;
  }
  .modal {
    width: min(760px, 96vw);
    max-height: 88vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 8px 32px rgba(0,0,0,.18);
  }
  .modal-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  .modal-title { font-size: 15px; font-weight: 700; color: var(--text); }
  .modal-body {
    padding: 16px 18px;
    overflow-y: auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 16px;
  }
  .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .field.full { grid-column: 1 / -1; }
  .field > label { font-size: 12px; color: var(--text-muted); }
  .field input[type="text"],
  .field input[type="password"],
  .field input[type="number"],
  .field textarea {
    width: 100%;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font: inherit;
    font-size: 13px;
    padding: 7px 9px;
    outline: none;
  }
  .field input:focus, .field textarea:focus { border-color: var(--accent); }
  .field textarea {
    min-height: 130px;
    resize: vertical;
    font-family: var(--font-mono);
    font-size: 12.5px;
    line-height: 1.5;
  }
  .field.bool { flex-direction: row; align-items: center; gap: 8px; }
  .field.bool input { width: 15px; height: 15px; accent-color: var(--accent); }
  .modal-foot {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 18px;
    border-top: 1px solid var(--border);
    flex: none;
  }
  .modal-hint {
    flex: 1; min-width: 0;
    font-size: 11px; color: var(--text-dim);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .btn {
    height: 36px;
    padding: 0 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-panel);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .btn:hover { background: var(--bg-hover); }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #0b1220;
    font-weight: 600;
  }
  .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  :root[data-theme="light"] .btn.primary { color: #ffffff; }
  .icon-btn {
    width: 28px; height: 28px;
    border: none; border-radius: 6px;
    background: transparent;
    color: var(--text-muted);
    font-size: 16px; line-height: 1;
    cursor: pointer;
    display: grid; place-items: center;
  }
  .icon-btn:hover { background: var(--bg-hover); color: var(--text); }

  @media (max-width: 700px) {
    .modal-body { grid-template-columns: 1fr; }
    .layout { flex-direction: column; }
    .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
    .session-list { display: flex; flex-wrap: nowrap; overflow-x: auto; padding: 6px; }
    .session-item { flex: none; min-width: 130px; }
  }
  @media (max-width: 560px) {
    .bubble { max-width: 92%; }
    .chat { padding: 18px 14px 36px; }
  }
</style>
</head>
<body>
  <!-- ハンバーガーと × は同じ位置(左上)に固定し、表示だけ切り替える -->
  <button type="button" id="sideToggle" class="fab" title="サイドバーを表示">☰</button>
  <button type="button" id="sideClose" class="fab" title="サイドバーを閉じる">×</button>
  <div class="layout">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-head">
        <span class="sidebar-title">Sessions</span>
        <div class="side-actions">
          <button type="button" id="newBtn" class="new-btn" title="新規セッション">＋</button>
        </div>
      </div>
      <div id="sessionList" class="session-list"></div>
    </aside>
    <main id="main">
      <div class="chat" id="chat"></div>
    </main>
  </div>

  <footer>
    <div class="composer">
      <div class="side">
        <textarea id="input" rows="1" placeholder="AI エージェントに質問する…  (Enter で送信 / Shift+Enter で改行)"></textarea>
      </div>
      <button type="button" class="send" id="sendBtn" disabled title="送信">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M3.4 20.4 22 12 3.4 3.6 3.4 10 15 12 3.4 14Z"/>
        </svg>
      </button>
    </div>
    <div class="composer-bar">
      <span class="status" id="conn">connecting…</span>
      <span class="badge">model <b id="modelLabel">—</b></span>
      <button type="button" class="badge tools-toggle" id="toolsBadge" title="ツール実行を切り替え">tools —</button>
      <button type="button" class="theme-link" id="themeBtn" title="テーマ切替">colorscheme dark</button>
      <button type="button" class="theme-link" id="settingsBtn" title="設定">⚙ settings</button>
    </div>
  </footer>

  <!-- 設定モーダル -->
  <div class="modal-overlay" id="settingsModal" style="display:none">
    <div class="modal" role="dialog" aria-modal="true" aria-label="設定">
      <div class="modal-head">
        <div class="modal-title">Settings</div>
        <button type="button" class="icon-btn" id="settingsClose" title="閉じる" style="margin-left:auto">×</button>
      </div>
      <div class="modal-body" id="settingsBody"></div>
      <div class="modal-foot">
        <span class="modal-hint" id="settingsHint"></span>
        <button type="button" class="btn" id="settingsCancel">Cancel</button>
        <button type="button" class="btn primary" id="settingsSave">Save</button>
      </div>
    </div>
  </div>

<script>
"use strict";

/* ---------- tiny markdown renderer (XSS-safe: escapes then formats) ---------- */
function escapeHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
          .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function renderMarkdown(src) {
  // mermaid ブロックはエスケープ前に退避(プレースホルダ化)
  var mermaidSrc = [];
  src = String(src || "").replace(/```mermaid\s*\n([\s\S]*?)```/gi, function(_, code){
    mermaidSrc.push(code.replace(/\n$/, ""));
    return "\u0000M" + (mermaidSrc.length - 1) + "\u0000";
  });
  src = escapeHtml(src || "");
  // code blocks
  src = src.replace(/```([A-Za-z0-9_+-]*)\n([\s\S]*?)```/g, function(_, lang, code){
    return "<pre><code>" + code.replace(/\n$/, "") + "</code></pre>";
  });
  // inline code
  src = src.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  // headings
  src = src.replace(/^###### (.*)$/gm, "<h6>$1</h6>");
  src = src.replace(/^##### (.*)$/gm, "<h5>$1</h5>");
  src = src.replace(/^#### (.*)$/gm, "<h4>$1</h4>");
  src = src.replace(/^### (.*)$/gm, "<h3>$1</h3>");
  src = src.replace(/^## (.*)$/gm, "<h2>$1</h2>");
  src = src.replace(/^# (.*)$/gm, "<h1>$1</h1>");
  // links
  src = src.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // bold / italic
  src = src.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  src = src.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  // blockquote
  src = src.replace(/^&gt; (.*)$/gm, function(_, t){ return "<blockquote>" + t + "</blockquote>"; });
  // hr
  src = src.replace(/^---+$/gm, "<hr/>");
  // lists (unordered/ordered) - li を必ず ul/ol で囲む
  src = src.replace(/^[ \t]*[-*+][ \t]+(.*)$/gm, "<li class=\"u\">$1</li>");
  src = src.replace(/^[ \t]*\d+\.[ \t]+(.*)$/gm, "<li class=\"o\">$1</li>");
  src = src.replace(/((?:<li class=\"u\">.*?<\/li>[ \t]*\n?)+)/g, "<ul>$1</ul>");
  src = src.replace(/((?:<li class=\"o\">.*?<\/li>[ \t]*\n?)+)/g, "<ol>$1</ol>");
  src = src.replace(/<li class=\"u\">/g, "<li>");
  src = src.replace(/<li class=\"o\">/g, "<li>");
  // tables  (Markdown 表: | a | b |  + separator)
  src = src.replace(/((?:^\|[^\n]*\|[ \t]*$\n?)+)/gm, function(block){
    var lines = block.trim().split("\n").map(function(l){ return l.trim(); })
      .filter(function(l){ return /^\|.*\|$/.test(l); });
    if (lines.length < 2) return block;
    var cells = function(l){ return l.replace(/^\||\|$/g,"").split("|").map(function(c){ return c.trim(); }); };
    var isSep = function(l){ return /[\s|:-]+/.test(l) && l.indexOf("-") >= 0 && !/[^\s|:-]/.test(l); };
    var header = cells(lines[0]);
    var start = (lines.length > 1 && isSep(lines[1])) ? 1 : 0;
    var thead = "<thead><tr>" + header.map(function(c){ return "<th>" + c + "</th>"; }).join("") + "</tr></thead>";
    var tbody = "<tbody>";
    for (var t = start + 1; t < lines.length; t++){
      var cs = cells(lines[t]);
      if (cs.length > 0) tbody += "<tr>" + cs.map(function(c){ return "<td>" + c + "</td>"; }).join("") + "</tr>";
    }
    tbody += "</tbody>";
    return "<table>" + thead + tbody + "</table>";
  });
  // mermaid プレースホルダを実体(div)へ戻す。行頭が '<' なので段落化で囲まれない
  src = src.replace(/\u0000M(\d+)\u0000/g, function(_, i){
    return '<div class="mermaid" data-b64="' + b64e(mermaidSrc[parseInt(i,10)]) + '"></div>';
  });
  // paragraphs (group consecutive non-list/tag lines)
  src = src.replace(/^([^<][^\n]*)$/gm, function(m){ return "<p>"+m+"</p>"; });
  return src.replace(/\n{2,}/g, "\n").trim();
}

/* ---------- Mermaid レンダリング ---------- */
function b64e(s){ try{ return btoa(unescape(encodeURIComponent(s))); }catch(e){ return btoa(s); } }
function decodeB64(s){ try{ return decodeURIComponent(escape(atob(s))); }catch(e){ return atob(s); } }

var __mermaidState = { loaded:false, loading:false };
function showMermaidError(el){
  var src = decodeB64(el.getAttribute("data-b64")||"");
  el.innerHTML = '<pre class="mermaid-fallback">' + escapeHtml(src) + '</pre>' +
                 '<div class="mermaid-note">&#9888; Mermaid 表示に失敗しました(CDNに接続できませんでした)。</div>';
  el.classList.add("done");
}
function loadMermaid(cb){
  if (window.mermaid) { cb(); return; }
  if (__mermaidState.loading) { setTimeout(function(){ loadMermaid(cb); }, 250); return; }
  __mermaidState.loading = true;
  var s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js";
  s.onload = function(){ __mermaidState.loaded = true; __mermaidState.loading = false; cb(); };
  s.onerror = function(){
    __mermaidState.loading = false;
    var els = document.querySelectorAll(".mermaid[data-b64]:not(.done)");
    Array.prototype.forEach.call(els, function(e){ showMermaidError(e); });
  };
  document.head.appendChild(s);
}
function runMermaid(){
  var els = document.querySelectorAll(".mermaid[data-b64]:not(.done)");
  if (!els.length) return;
  var theme = document.documentElement.getAttribute("data-theme") === "light" ? "default" : "dark";
  Array.prototype.forEach.call(els, function(el){
    el.classList.add("done");
    el.innerHTML = '<div class="mermaid-loading">図をレンダリング中…</div>';
  });
  loadMermaid(function(){
    if (window.mermaid) { try { mermaid.initialize({ startOnLoad:false, theme: theme }); } catch(e){} }
    Array.prototype.forEach.call(els, function(el){
      var srcText = decodeB64(el.getAttribute("data-b64")||"");
      (function(elm, src){
        var id = "mm" + Math.random().toString(36).slice(2,8);
        try {
          var pr = mermaid.render(id, src);
          if (pr && pr.then) pr.then(function(res){ elm.innerHTML = res.svg; }).catch(function(){ showMermaidError(elm); });
          else { elm.innerHTML = pr; }
        } catch(e){ showMermaidError(elm); }
      })(el, srcText);
    });
  });
}

/* ---------- DOM helpers ---------- */
var chatEl = document.getElementById("chat");
var inputEl = document.getElementById("input");
var sendBtn = document.getElementById("sendBtn");
var sideToggle = document.getElementById("sideToggle");
var toolsBadge = document.getElementById("toolsBadge");
var allowTools = true;
function updateToolsBadge() {
  if (!toolsBadge) return;
  toolsBadge.innerHTML = "tools <b>" + (allowTools ? "on" : "off") + "</b>";
  toolsBadge.style.color = allowTools ? "" : "#f87171";
  toolsBadge.title = "ツール実行を" + (allowTools ? "無効化" : "有効化");
}
var connEl = document.getElementById("conn");
var modelEl = document.getElementById("modelLabel");

function emptyState(show) {
  if (show) {
    chatEl.innerHTML = ""; // 初期状態は空白
  } else {
    chatEl.innerHTML = "";
  }
}

function fmtNow() {
  var d = new Date();
  function p(x){ return (x < 10 ? "0" : "") + x; }
  return d.getFullYear() + "/" + p(d.getMonth()+1) + "/" + p(d.getDate())
       + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}

var COPY_ICON = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
var CHECK_ICON = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>';

// クリップボードへコピー（失敗時は execCommand にフォールバック）
function copyToClipboard(text, btn) {
  function done() {
    if (!btn) return;
    btn.classList.add("copied");
    btn.innerHTML = CHECK_ICON;
    btn.title = "コピーしました";
    setTimeout(function(){
      btn.classList.remove("copied");
      btn.innerHTML = COPY_ICON;
      btn.title = "内容をコピー";
    }, 1200);
  }
  function fallback() {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { }
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else {
    fallback();
  }
}

// ツール実行記録(配列) → HTML。live 表示とリロード後の復元で共用する
function progressHtml(list) {
  if (!list || !list.length) return "";
  var html = "";
  for (var i = 0; i < list.length; i++) {
    var s = String(list[i]);
    var m = s.match(/^ツール実行:\s+(.*?)\s{2,}([\s\S]*)$/);
    if (m) {
      html += '<div class="pstep">▶ ツール実行: ' + escapeHtml(m[1]) + '</div>' +
              '<div class="pdetail">' + escapeHtml(m[2]) + '</div>';
    } else {
      html += '<div class="pstep">▶ ' + escapeHtml(s) + '</div>';
    }
  }
  return html;
}

function bubble(role, text, ts, rawText) {
  var row = document.createElement("div");
  row.className = "msg " + role;
  var b = document.createElement("div");
  b.className = "bubble";
  b.innerHTML = text;
  b._copyText = (rawText == null) ? b.textContent : rawText;

  var cbtn = document.createElement("button");
  cbtn.type = "button";
  cbtn.className = "copy-btn";
  cbtn.title = "内容をコピー";
  cbtn.innerHTML = COPY_ICON;
  cbtn.addEventListener("click", function(ev){
    ev.stopPropagation();
    copyToClipboard(String(b._copyText == null ? b.textContent : b._copyText), cbtn);
  });
  b.appendChild(cbtn);

  if (ts) {
    var tsp = document.createElement("div");
    tsp.className = "ts";
    tsp.textContent = ts;
    b.appendChild(tsp);
  }
  row.appendChild(b);
  chatEl.appendChild(row);
  return b;
}

function userMsg(text, ts) {
  var el = bubble("user", escapeHtml(text), ts || fmtNow(), text);
  return el;
}
function assistantMsg(md, ts, steps) {
  var el = bubble("assistant", '<div class="md">' + renderMarkdown(md) + '</div>', ts || fmtNow(), md);
  var html = progressHtml(steps);   // 保存されたツール実行記録(リロード後も表示)
  if (html) {
    var mdEl = el.querySelector(".md");
    var pb = document.createElement("div");
    pb.className = "progress";
    pb.innerHTML = html;
    el.insertBefore(pb, mdEl);
  }
  return el;
}
// 待機中の表示 (Pi Web の "Waiting for model..." と同じ)
function waitingHtml() { return '<span class="wtext">Waiting for model...</span>'; }
function addTyping() {
  var row = document.createElement("div");
  row.className = "msg assistant";
  row.id = "typing";
  row.innerHTML = '<div class="bubble"><div class="waiting">' + waitingHtml() + '</div><div class="progress" id="progressBox"></div></div>';
  chatEl.appendChild(row);
  scrollBottom();
  return row;
}
function scrollBottom() {
  var m = document.getElementById("main");
  m.scrollTop = m.scrollHeight;
  runMermaid();
}
function resizeInput() {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + "px";
}

/* ---------- chat state ---------- */
var busy = false;
var hasMessages = false;
var serverBusy = false;   // サーバ側の処理中フラグ (/api/health の busy)
var busyTimer = null;     // 処理中ステータスのポーリングタイマー
var sessionListEl = document.getElementById("sessionList");
var newBtn = document.getElementById("newBtn");

// 現在のセッションID (ローカルに保持、サーバ管理のセッションと紐付け)
var sessionId = localStorage.getItem("aiagent.session") || "";

function emptyChat() { chatEl.innerHTML = ""; hasMessages = false; emptyState(true); }

function renderSessionList(sessions, selected) {
  sessionListEl.innerHTML = "";
  sessions.forEach(function(s){
    var cnt = (s.count || 0);
    var item = document.createElement("div");
    item.className = "session-item" + (s.id === selected ? " active" : "");
    item.setAttribute("data-id", s.id);
    item.title = s.title || "会話";
    item.addEventListener("click", function(){ selectSession(s.id); });

    var txt = document.createElement("div");
    txt.className = "s-txt";
    txt.textContent = (s.title || "会話") + (cnt > 0 ? " · " + cnt : "");

    var ren = document.createElement("button");
    ren.className = "s-ren";
    ren.title = "名前を変更";
    ren.textContent = "✎";
    ren.addEventListener("click", function(ev){
      ev.stopPropagation();
      startRename(s.id, s.title || "", item, txt);
    });

    var auto = document.createElement("button");
    auto.className = "s-auto";
    auto.title = "会話内容から名前を自動設定";
    auto.textContent = "⟳";
    auto.addEventListener("click", function(ev){
      ev.stopPropagation();
      autoTitle(s.id, auto);
    });

    var del = document.createElement("button");
    del.className = "s-del";
    del.title = "このセッションを削除";
    del.textContent = "×";
    del.addEventListener("click", function(ev){
      ev.stopPropagation();
      deleteSession(s.id, s.title);
    });

    item.appendChild(txt);
    item.appendChild(auto);
    item.appendChild(ren);
    item.appendChild(del);
    sessionListEl.appendChild(item);
  });
}

// サイドバー内でタイトルをインライン編集する
function startRename(id, currentTitle, item, txt) {
  var input = document.createElement("input");
  input.className = "s-edit";
  input.value = currentTitle;
  txt.replaceWith(input);
  input.focus();
  input.select();

  var commit = function(){
    var v = input.value.trim();
    if (v.length === 0) v = "新規会話";
    fetch("/api/sessions/" + encodeURIComponent(id) + "/rename", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title: v })
    }).catch(function(){}).then(function(){ refreshSessionList(); });
  };
  input.addEventListener("keydown", function(e){
    if (e.key === "Enter") { e.preventDefault(); commit(); }
    else if (e.key === "Escape") { refreshSessionList(); }
  });
  input.addEventListener("blur", commit);
}

// 会話内容からセッション名を自動設定
function autoTitle(id, btn) {
  if (!id) return;
  var prev = btn ? btn.textContent : null;
  if (btn) { btn.disabled = true; btn.textContent = "…"; }
  fetch("/api/sessions/" + encodeURIComponent(id) + "/autotitle", { method: "POST" })
    .then(function(r){ return r.json().catch(function(){ return null; }); })
    .then(function(d){
      if (d && d.ok) { refreshSessionList(); }
      else { alert("名前の自動設定に失敗しました: " + ((d && (d.message || d.error)) || "不明なエラー")); }
    })
    .catch(function(){ alert("名前の自動設定に失敗しました(通信エラー)"); })
    .then(function(){ if (btn) { btn.disabled = false; btn.textContent = prev || "⟳"; } });
}

function deleteSession(id, title) {
  var name = (title && String(title).trim().length > 0) ? String(title).trim() : "（無題）";
  var ok = false;
  try {
    ok = confirm("このセッションを削除しますか？\n\n" + name + "\n\n削除した会話履歴は元に戻せません。");
  } catch (e) {
    ok = true;   // confirm が使えない環境ではそのまま削除
  }
  if (!ok) return;
  fetch("/api/sessions/" + encodeURIComponent(id), { method: "DELETE" })
    .catch(function(){})
    .then(function(){ refreshSessions(); });
}

// 取得済みメッセージ [{role,content},...] を表示に反映
function loadSession(messages) {
  hasMessages = false;
  chatEl.innerHTML = "";
  if (!messages || messages.length === 0) { emptyState(true); return; }
  emptyState(false); hasMessages = true;
  messages.forEach(function(m){
    if (m.role === "user") userMsg(m.content, m.ts);
    else if (m.role === "assistant") assistantMsg(m.content, m.ts, m.steps);
  });
  if (serverBusy) ensureTyping();
  scrollBottom();
}

function fetchSession(id) {
  fetch("/api/sessions/" + encodeURIComponent(id))
    .then(function(r){ return r.json().catch(function(){ return null; }); })
    .then(function(d){
      if (d && d.ok) loadSession(d.messages || []);
      else emptyChat();
    })
    .catch(function(){ emptyChat(); });
}

function selectSession(id) {
  if (!id || busy) return;
  sessionId = id;
  localStorage.setItem("aiagent.session", id);
  updateActiveItem();   // 一覧の active を即時更新(再描画しない)
  fetchSession(id);
}

// 現在の sessionId に合わせて一覧の active クラスを付け替える
function updateActiveItem() {
  if (!sessionListEl) return;
  var items = sessionListEl.querySelectorAll(".session-item");
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    var id = it.getAttribute("data-id") || "";
    if (id === sessionId) it.classList.add("active");
    else it.classList.remove("active");
  }
}

function refreshSessions() {
  fetch("/api/sessions")
    .then(function(r){ return r.json().catch(function(){ return null; }); })
    .then(function(d){
      if (!d || !d.ok) { emptyChat(); return; }
      var sessions = d.sessions || [];
      var exists = sessions.some(function(s){ return s.id === sessionId; });
      var target = sessionId;
      if (!exists) {
        if (sessions.length > 0) target = sessions[0].id; // 最近のセッションへ
        else { createSession(true); return; }              // 1つも無ければ作成
      }
      renderSessionList(sessions, target);
      sessionId = target;
      localStorage.setItem("aiagent.session", target);
      fetchSession(target);
    })
    .catch(function(){ emptyChat(); });
}

// サイドバーの一覧だけを更新する（会話の再描画はしない＝ツール実行の表示を消さない）
function refreshSessionList() {
  fetch("/api/sessions")
    .then(function(r){ return r.json().catch(function(){ return null; }); })
    .then(function(d){
      if (!d || !d.ok) return;
      var sessions = d.sessions || [];
      var exists = sessions.some(function(s){ return s.id === sessionId; });
      if (!exists && sessions.length > 0) {
        sessionId = sessions[0].id;
        localStorage.setItem("aiagent.session", sessionId);
      }
      renderSessionList(sessions, sessionId);
    })
    .catch(function(){});
}

function createSession(silent) {
  fetch("/api/sessions", { method: "POST" })
    .then(function(r){ return r.json().catch(function(){ return null; }); })
    .then(function(d){
      if (d && d.ok) {
        sessionId = d.session;
        localStorage.setItem("aiagent.session", sessionId);
        emptyChat();
        refreshSessions();
      }
    });
}

var sendBtnHTML = sendBtn.innerHTML; // 元の送信アイコン
function setSendAsStop(b) {
  if (b) {
    sendBtn.classList.add("stop");     // 停止中は赤色 (Pi Web と同じ)
    sendBtn.innerHTML = "■";
    sendBtn.style.fontSize = "18px";
    sendBtn.title = "処理を中止";
  } else {
    sendBtn.classList.remove("stop");
    sendBtn.innerHTML = sendBtnHTML;
    sendBtn.style.fontSize = "";
    sendBtn.title = "送信";
  }
}
function setBusy(b) {
  busy = b;
  sendBtn.disabled = false;   // busy中は送信ボタンを「停止」として使う
  sendBtn.style.opacity = "1";
  setSendAsStop(b);
}

function hideTyping() {
  var t = document.getElementById("typing");
  if (t) t.remove();
}
function ensureTyping() {
  if (serverBusy && !document.getElementById("typing")) addTyping();
}
function renderProgress(steps) {
  var box = document.getElementById("progressBox");
  if (!box) return;
  var arr = steps || [];
  var html = "";
  for (var i = 0; i < arr.length; i++)
    html += '<div class="pstep">' + escapeHtml(String(arr[i])) + '</div>';
  box.innerHTML = html;
}
function startBusyPoll() {
  if (!busyTimer) busyTimer = setInterval(pollServerBusy, 2500);
}
function stopBusyPoll() {
  if (busyTimer) { clearInterval(busyTimer); busyTimer = null; }
}

// サーバの処理中ステータスをポーリングし、完了したら反映する
function pollServerBusy() {
  fetch("/api/health").then(function(r){ return r.json().catch(function(){ return null; }); })
    .then(function(d){
      var was = serverBusy;
      serverBusy = !!(d && d.busy);
      if (serverBusy) {
        setBusy(true);
        ensureTyping();
        renderProgress(d && d.progress);
        startBusyPoll();
        connEl.textContent = "応答中…";
        connEl.style.color = "#fbbf24";
      } else {
        stopBusyPoll();
        if (was) {
          setBusy(false);
          hideTyping();
          connEl.textContent = "connected";
          connEl.style.color = "#4ade80";
          refreshSessionList(); // 一覧のみ更新(会話の再描画はしない)
        }
      }
    })
    .catch(function(){}); // エラー時もポーリングを継続
}

// 起動時: サーバ状態(モデル・ツール・APIキー・busy)を取得してから表示
function initServerState() {
  fetch("/api/health").then(function(r){ return r.json().catch(function(){ return null; }); })
    .then(function(d){
      if (d && d.ok) {
        modelEl.textContent = d.model || "—";
        allowTools = !(d.allowTools === false);
        updateToolsBadge();
        serverBusy = !!(d.busy);
        if (serverBusy) {
          setBusy(true);
          if (!document.getElementById("typing")) addTyping();
          renderProgress(d && d.progress);
          startBusyPoll();
          connEl.textContent = "応答中…";
          connEl.style.color = "#fbbf24";
        } else if (d.apiKey === "not-set") {
          connEl.textContent = "LLM_API_KEY 未設定";
          connEl.style.color = "#fbbf24";
        } else {
          connEl.textContent = "connected";
          connEl.style.color = "#4ade80";
        }
      } else {
        connEl.textContent = "connected";
        connEl.style.color = "#4ade80";
      }
      refreshSessions(); // サーバ状態確定後にセッションを読み込み
    })
    .catch(function(){ connEl.textContent = "connected"; connEl.style.color = "#4ade80"; refreshSessions(); });
}

function send() {
  var text = inputEl.value.trim();
  if (!text || busy) return;
  if (!hasMessages) { emptyState(false); hasMessages = true; }
  userMsg(text);
  inputEl.value = ""; resizeInput();
  scrollBottom();
  setBusy(true);
  connEl.textContent = "応答中…"; connEl.style.color = "#fbbf24";

  var bubbleEl = assistantMsg("");                // 空の assistant 吹き出し
  var mdEl = bubbleEl.querySelector(".md");
  var prog = document.createElement("div");       // ツール実行の表示(思考ブロックの外・吹き出し上部)
  prog.className = "progress";
  prog.style.display = "none";
  bubbleEl.insertBefore(prog, mdEl);

  // 待機表示: Pi Web と同じ "Waiting for model..."
  var waitEl = document.createElement("div");
  waitEl.className = "waiting";
  waitEl.innerHTML = waitingHtml();
  bubbleEl.insertBefore(waitEl, mdEl);
  function hideWait() {
    if (waitEl && waitEl.parentNode) waitEl.parentNode.removeChild(waitEl);
    waitEl = null;
  }

  // ツール実行の表示: SSE の tool イベントに加え、/api/health の progress を定期取得して
  // 取りこぼしがあっても必ず表示されるようにする(サーバ状態が唯一の真実)。
  var progTimer = null;
  function renderProgressList(list) {
    var html = progressHtml(list);
    if (!html) return;
    prog.innerHTML = html;
    prog.style.display = "block";
    scrollBottom();
  }
  function pollProgress() {
    fetch("/api/health")
      .then(function(r){ return r.json().catch(function(){ return null; }); })
      .then(function(h){ if (h) renderProgressList(h.progress); })
      .catch(function(){});
  }
  function startProgressPoll() {
    if (!progTimer) progTimer = setInterval(pollProgress, 1200);
  }
  function stopProgressPoll() {
    if (progTimer) { clearInterval(progTimer); progTimer = null; }
  }
  startProgressPoll();

  // 思考(thinking)ブロック: reasoning トークンが来たら生成
  var thinkEl = null, thinkBody = null, thinkText = "";
  function ensureThink() {
    if (thinkEl) return;
    thinkEl = document.createElement("details");
    thinkEl.className = "think";
    thinkEl.open = true;
    var sum = document.createElement("summary");
    sum.textContent = "Thinking...";
    rateEl = document.createElement("span");   // tok/s 表示 (Pi Web 風)
    rateEl.className = "rate";
    sum.appendChild(rateEl);
    thinkBody = document.createElement("div");
    thinkBody.className = "think-body";
    thinkEl.appendChild(sum);
    thinkEl.appendChild(thinkBody);
    bubbleEl.insertBefore(thinkEl, mdEl);
  }

  var fullText = "";
  var lastPaint = 0;

  // --- tok/s 表示 (Pi Web 風) ---
  // 出力文字数から概算する (4文字 ≒ 1トークン)。直近3秒の移動平均。
  var rateChars = 0;
  var rateSamples = [];
  var rateTimer = null;
  var rateEl = null;
  function rateTick() {
    var now = Date.now();
    rateSamples.push({ t: now, c: rateChars });
    while (rateSamples.length > 1 && now - rateSamples[0].t > 3000) rateSamples.shift();
    if (!rateEl || rateSamples.length < 2) return;
    var a = rateSamples[0], b = rateSamples[rateSamples.length - 1];
    var dt = (b.t - a.t) / 1000;
    if (dt <= 0.2) return;
    var v = (b.c - a.c) / 4 / dt;
    rateEl.textContent = v > 0 ? (" · " + v.toFixed(1) + " tok/s") : "";
  }
  function startRate() { if (!rateTimer) rateTimer = setInterval(rateTick, 250); }
  function stopRate() { if (rateTimer) { clearInterval(rateTimer); rateTimer = null; } }
  startRate();
  function paint(force) {
    var now = Date.now();
    if (!force && now - lastPaint < 40) return;
    lastPaint = now;
    mdEl.innerHTML = renderMarkdown(fullText);
    bubbleEl._copyText = fullText;   // コピー用に生のマークダウンを保持
    scrollBottom();
  }

  fetch("/api/chat/stream", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: text, session: sessionId })
  }).then(function(resp){
    if (!resp.ok || !resp.body) throw new Error("HTTP " + resp.status);
    var reader = resp.body.getReader();
    var decoder = new TextDecoder();
    var buf = "";

    function handle(ev, dat) {
      var d = null; try { d = JSON.parse(dat); } catch(e){}
      if (ev === "content" && d) {
        var ct = (d.t || "");
        fullText += ct;
        rateChars += ct.length;
        if (fullText.length > 0) hideWait();   // 最初の本文が来たら待機表示を消す
        paint(false);
      }
      else if (ev === "reasoning" && d) {
        var rt = (d.t || "");
        if (rt.length > 0) {
          hideWait();
          ensureThink();
          rateChars += rt.length;
          thinkText += rt;
          thinkBody.textContent = thinkText;
          scrollBottom();
        }
      }
      else if (ev === "tool" && d) {
        prog.style.display = "block";
        var _nm = escapeHtml(String(d.name||""));
        var _dt = escapeHtml(String(d.detail||""));
        prog.innerHTML = '<div class="pstep">▶ ツール実行: ' + _nm + '</div>' +
                         (_dt ? '<div class="pdetail">' + _dt + '</div>' : '');
        scrollBottom();
        pollProgress();   // サーバ側の進捗リストで確定させる
      }
      else if (ev === "error" && d) {
        hideWait();
        stopRate();
        stopProgressPoll();
        bubbleEl.innerHTML = '<div class="md"><div class="err">⚠ ' + escapeHtml(String(d.message||"エラー")) + '</div></div>';
      }
      else if (ev === "done" && d) {
        hideWait();
        stopRate();
        pollProgress();          // 最後の進捗を反映
        stopProgressPoll();
        // 思考は自動で折りたたまない(必要なとき手動で閉じる)
        if (d.session) { sessionId = d.session; localStorage.setItem("aiagent.session", sessionId); }
        refreshSessionList();   // 会話は再描画しない(ツール実行の表示を残す)
      }
    }

    function pump() {
      return reader.read().then(function(res){
        if (res.done) { paint(true); return; }
        buf += decoder.decode(res.value, {stream:true});
        buf = buf.replace(/\r\n/g, "\n");   // サーバは CRLF で送出するため LF に正規化
        var idx;
        while ((idx = buf.indexOf("\n\n")) >= 0) {
          var block = buf.slice(0, idx); buf = buf.slice(idx + 2);
          var ev = null, dat = null;
          block.split("\n").forEach(function(l){
            if (l.indexOf("event:") === 0) ev = l.slice(6).trim();
            else if (l.indexOf("data:") === 0) dat = l.slice(5).trim();
          });
          if (dat !== null && !(ev === "end")) handle(ev, dat);
        }
        return pump();
      });
    }
    return pump();
  }).then(function(){ paint(true); })
    .catch(function(err){
      stopRate();
      stopProgressPoll();
      bubbleEl.innerHTML = '<div class="md"><div class="err">⚠ 通信エラー: ' + escapeHtml(String(err)) + '</div></div>';
      refreshSessionList();
      connEl.textContent = "disconnected"; connEl.style.color = "#f87171";
    })
    .then(function(){ stopProgressPoll(); stopBusyPoll(); serverBusy = false; setBusy(false); refreshSessionList(); connEl.textContent="connected"; connEl.style.color="#4ade80"; });
}

/* ---------- events ---------- */
sendBtn.addEventListener("click", function(){
  if (busy) { fetch("/api/cancel", { method: "POST" }).catch(function(){}); }
  else { send(); }
});
inputEl.addEventListener("keydown", function(e){
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
inputEl.addEventListener("input", resizeInput);
inputEl.addEventListener("focus", function(){ if (!hasMessages) connEl.textContent = "connected"; });
newBtn.addEventListener("click", function(){ createSession(false); });

/* ---------- tools on/off 切替 ---------- */
toolsBadge.addEventListener("click", function(){
  fetch("/api/tools", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ allow: !allowTools })
  }).then(function(r){ return r.json().catch(function(){ return null; }); })
    .then(function(d){ if (d && d.ok) { allowTools = !!d.allowTools; updateToolsBadge(); } });
});

/* ---------- サイドバー表示/非表示 ---------- */
function applySidebar(show) {
  var sb = document.getElementById("sidebar");
  var fab = document.getElementById("sideToggle");
  var xbtn = document.getElementById("sideClose");
  if (sb) sb.classList.toggle("hidden", !show);
  // ハンバーガーと × は常に同じ位置(左上)に固定。表示だけ入れ替える。
  if (fab) fab.classList.toggle("on", !show);
  if (xbtn) xbtn.classList.toggle("on", show);
  try{ localStorage.setItem("aiagent.sidebar", show ? "1" : "0"); }catch(e){}
}
function initSidebar() {
  var v = "1";
  try{ v = localStorage.getItem("aiagent.sidebar") || "1"; }catch(e){}
  applySidebar(v !== "0");
}
sideToggle.addEventListener("click", function(){ applySidebar(true); });   // ハンバーガー→表示
document.getElementById("sideClose").addEventListener("click", function(){ applySidebar(false); }); // ×→非表示

/* ---------- テーマ切替 ---------- */
(function(){
  var btn = document.getElementById("themeBtn");
  function applyIcon(){
    var t = document.documentElement.getAttribute("data-theme");
    var isLight = (t === "light");
    btn.textContent = "colorscheme " + (isLight ? "light" : "dark"); // 現在の状態
    btn.title = isLight ? "ダークに切替" : "ライトに切替";
  }
  function setTheme(t){
    document.documentElement.setAttribute("data-theme", t);
    localStorage.setItem("aiagent.theme", t);
    applyIcon();
  }
  btn.addEventListener("click", function(){
    var cur = document.documentElement.getAttribute("data-theme") || "dark";
    setTheme(cur === "light" ? "dark" : "light");
  });
  applyIcon();
})();


/* ---------- 設定 (Web UI から agentweb.json を編集) ---------- */
var SETTINGS_FIELDS = [
  { k:"model",            label:"Model",                type:"text" },
  { k:"llmApiUrl",        label:"LLM API URL",          type:"text", full:true },
  { k:"llmApiKey",        label:"API Key",              type:"password", full:true },
  { k:"allowTools",       label:"Allow tools",          type:"bool" },
  { k:"emitReasoning",    label:"Emit reasoning",       type:"bool" },
  { k:"maxToolsPerTurn",  label:"Max tools / turn",     type:"number" },
  { k:"toolTimeoutSec",   label:"Tool timeout (sec)",   type:"number" },
  { k:"contextWindow",    label:"Context window",       type:"number" },
  { k:"reserveTokens",    label:"Reserve tokens",       type:"number" },
  { k:"keepRecentTokens", label:"Keep recent tokens",   type:"number" },
  { k:"useSystemProxy",   label:"Use system proxy",     type:"bool" },
  { k:"proxyUrl",         label:"Proxy URL",            type:"text", full:true },
  { k:"proxyUser",        label:"Proxy user",           type:"text" },
  { k:"proxyPass",        label:"Proxy password",       type:"password" },
  { k:"port",             label:"Port (要再起動)",        type:"number" },
  { k:"openBrowserOnStart", label:"Open browser on start", type:"bool" },
  { k:"bindPath",         label:"Bind path (静的ファイル)", type:"text", full:true },
  { k:"systemPrompt",     label:"System prompt",        type:"textarea", full:true }
];

var settingsEls = {};
var settingsModal = document.getElementById("settingsModal");
var settingsBody = document.getElementById("settingsBody");
var settingsHint = document.getElementById("settingsHint");
var settingsOriginPort = null;

(function buildSettingsForm(){
  SETTINGS_FIELDS.forEach(function(f){
    var wrap = document.createElement("div");
    wrap.className = "field" + (f.full ? " full" : "") + (f.type === "bool" ? " bool" : "");
    var el;
    if (f.type === "textarea") {
      el = document.createElement("textarea");
    } else {
      el = document.createElement("input");
      el.type = (f.type === "bool") ? "checkbox" : f.type;
    }
    el.id = "set_" + f.k;
    if (f.type === "bool") {
      // チェックボックスは先に置き、ラベルを横に並べる
      wrap.appendChild(el);
      var lb = document.createElement("label");
      lb.htmlFor = el.id;
      lb.textContent = f.label;
      wrap.appendChild(lb);
    } else {
      var lb2 = document.createElement("label");
      lb2.htmlFor = el.id;
      lb2.textContent = f.label;
      wrap.appendChild(lb2);
      wrap.appendChild(el);
    }
    settingsBody.appendChild(wrap);
    settingsEls[f.k] = el;
  });
})();

function openSettings(){
  fetch("/api/config")
    .then(function(r){ return r.json().catch(function(){ return null; }); })
    .then(function(d){
      if (!d || !d.ok) { alert("設定の取得に失敗しました"); return; }
      var c = d.config || {};
      SETTINGS_FIELDS.forEach(function(f){
        var el = settingsEls[f.k];
        var v = c[f.k];
        if (f.type === "bool") el.checked = !!v;
        else el.value = (v == null) ? "" : String(v);
      });
      settingsOriginPort = c.port;
      settingsHint.textContent = d.path ? ("保存先: " + d.path) : "";
      settingsModal.style.display = "grid";
    })
    .catch(function(){ alert("設定の取得に失敗しました(通信エラー)"); });
}

function closeSettings(){ settingsModal.style.display = "none"; }

function saveSettings(){
  var body = {};
  SETTINGS_FIELDS.forEach(function(f){
    var el = settingsEls[f.k];
    if (f.type === "bool") body[f.k] = el.checked;
    else if (f.type === "number") body[f.k] = parseInt(el.value, 10) || 0;
    else body[f.k] = el.value;
  });
  var btn = document.getElementById("settingsSave");
  btn.disabled = true;
  fetch("/api/config", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  })
    .then(function(r){ return r.json().catch(function(){ return null; }); })
    .then(function(d){
      btn.disabled = false;
      if (!d || !d.ok) { alert("設定の保存に失敗しました: " + ((d && d.message) || "不明なエラー")); return; }
      closeSettings();
      // ツール可否は即時反映されるのでバッジを更新
      if (d.config && typeof d.config.allowTools === "boolean") {
        allowTools = d.config.allowTools;
        updateToolsBadge();
      }
      if (settingsOriginPort != null && d.config && d.config.port !== settingsOriginPort) {
        alert("ポート番号を変更しました。反映には agentweb.exe の再起動が必要です。");
      }
    })
    .catch(function(){ btn.disabled = false; alert("設定の保存に失敗しました(通信エラー)"); });
}

document.getElementById("settingsBtn").addEventListener("click", openSettings);
document.getElementById("settingsClose").addEventListener("click", closeSettings);
document.getElementById("settingsCancel").addEventListener("click", closeSettings);
document.getElementById("settingsSave").addEventListener("click", saveSettings);
settingsModal.addEventListener("click", function(e){ if (e.target === settingsModal) closeSettings(); });
document.addEventListener("keydown", function(e){
  if (e.key === "Escape" && settingsModal.style.display !== "none") closeSettings();
});

/* ---------- init ---------- */
resizeInput();
inputEl.focus();
emptyState(true);
sendBtn.disabled = false;
initSidebar();
initServerState(); // サーバ状態を反映しつつセッションを読み込む
</script>
</body>
